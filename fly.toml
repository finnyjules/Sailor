# Fly.io config for Sailor — Nuxt frontend + CPU-only ComfyUI in one machine.
# Generation runs on Replicate/fal, so no GPU is required.
#
# HOSTING DECISION 2026-08-17 (docs/superpowers/specs/2026-08-17-hosting-decision-fly.md):
# Fly.io, region sjc, auto-stop-by-default. The app name below is a
# placeholder from the old scaffold — the original app was deleted; pick the
# real name at first `flyctl launch` and keep it in sync with any secrets.

app = "vessell"
primary_region = "sjc"   # San Jose — nearest to Neon (aws-us-west-2, Oregon).

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  # Stage 6 (I3) — relocate the flat JSON/asset stores (brand kits, moodboards,
  # templates, template fonts, .data secrets) onto the Fly volume. Without this
  # dataDir.ts's storeDir() falls back to the EPHEMERAL container disk and every
  # one of those stores is lost on redeploy — the "durable on the volume" headline
  # silently fails. start.sh pre-creates /data/sailor; storeDir() mkdir's each
  # store subdir under it on first use. Unset locally → historical paths, byte-identical.
  SAILOR_DATA_DIR = "/data/sailor"
  # Sailor's runner families (engine-free step 3, R10.0, user go 2026-10-02).
  # Every family that has passed its live check is on, matching the local .env.
  # Still off until its live check passes: reve-2.1 (fal endpoint id wrong, 404 on 2026-10-02).
  # Both lists must stay identical (server and client read their own copy).
  NUXT_RUNNER_FAMILIES = "frame,cards,effects-tone,effects-blur,effects-cells,effects-warp,effects-mask,effects-noise,shader-bake,live-previews,fal-edit,replicate-image,replicate-video,nano-banana-2-blend,nano-actions,ref-edits,restyle,wan-3,gpt-image-2.5,h3-max-turbo,gemini-omni-flash,veo-3.1-lite,qwen-image-3,grok-imagine-2,seedream-5-pro-edit,qwen-2511-angles,bria-product-shot,muse-image,nano-banana-2-lite,recraft-v4.1,krea-2,happyhorse-1.1,grok-imagine-video-1.5,ltx-2.5-fast,luma-ray-3.2,sync-3,topaz-video,media-sound,media-video,video-time,video-join,video-look,video-stabilize,video-flow,video-draw,video-text,sound-effects,sound-denoise,bg-remove,upscale-2x,object-remove,sam-3-masks,subject-mask,slow-motion-ai,whisper-captions,vocal-split,lens-blur,face-swap,llm-text,describe,image-repair,layers,audio-gen,gen-3d,sound-in,film-shot,image-extras,lora,nano-extras,turntable,recraft-svg,ideogram-4.5,flux-3-image,fix-faces,ideogram-4,person-swap-video"
  NUXT_PUBLIC_RUNNER_FAMILIES = "frame,cards,effects-tone,effects-blur,effects-cells,effects-warp,effects-mask,effects-noise,shader-bake,live-previews,fal-edit,replicate-image,replicate-video,nano-banana-2-blend,nano-actions,ref-edits,restyle,wan-3,gpt-image-2.5,h3-max-turbo,gemini-omni-flash,veo-3.1-lite,qwen-image-3,grok-imagine-2,seedream-5-pro-edit,qwen-2511-angles,bria-product-shot,muse-image,nano-banana-2-lite,recraft-v4.1,krea-2,happyhorse-1.1,grok-imagine-video-1.5,ltx-2.5-fast,luma-ray-3.2,sync-3,topaz-video,media-sound,media-video,video-time,video-join,video-look,video-stabilize,video-flow,video-draw,video-text,sound-effects,sound-denoise,bg-remove,upscale-2x,object-remove,sam-3-masks,subject-mask,slow-motion-ai,whisper-captions,vocal-split,lens-blur,face-swap,llm-text,describe,image-repair,layers,audio-gen,gen-3d,sound-in,film-shot,image-extras,lora,nano-extras,turntable,recraft-svg,ideogram-4.5,flux-3-image,fix-faces,ideogram-4,person-swap-video"
  # NUXT_PUBLIC_COMFY_ORIGIN must NEVER be set on hosted deploys (Stage 5
  # invariant): the hosted client hard-forces engineOrigin to '' and reaches
  # the engine only through the authenticated same-origin proxy. Setting it
  # would only mislead readers — the client ignores it in hosted mode.

# Persistent storage for outputs, uploads, and user settings/workflows.
# Stage 5 deploy precondition: the engine input/ dir must start EMPTY (or
# input_uploads must be backfilled) — see the Stage 5 verification doc.
[[mounts]]
  source = "vessell_data"
  destination = "/data"

###############################################################################
# Service — Nuxt frontend (the ONLY public service).
#
# auto_stop_machines: the machine stops when traffic goes quiet and boots on
# the next request (~15-30s for ComfyUI). An idle month costs volume storage
# only (~$1-2), not ~$30 of always-on compute — deliberate choice 2026-08-17
# after exactly that bill. Flip min_machines_running to 1 (and auto_stop to
# "off") only for the beta window, as an explicit decision.
###############################################################################
[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

###############################################################################
# There is deliberately NO second service for ComfyUI. The old "Service B"
# exposed unauthenticated :8188 publicly (anyone could queue prompts on the
# operator's provider keys and read every generated file) and was removed
# 2026-08-12. Stage 5 (landed 2026-08-17) made it permanently unnecessary:
# every engine path — HTTP and WebSocket — is served through the
# authenticated, tenant-gated Nitro proxy on :3000. Never re-expose :8188.
#
# Deploy-day riders (see the Stage 5 verification doc + hosting decision):
# production WS auth (the dev-hook auth doesn't exist in built Nitro),
# SAILOR_ENGINE_ROOT env if processes don't launch from frontend/.
###############################################################################

[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"
