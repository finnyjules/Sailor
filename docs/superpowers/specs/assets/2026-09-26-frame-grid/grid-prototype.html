<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame grid prototype</title>
<style>
  :root {
    --bg: #0c0c0e; --panel: #151518; --line: rgba(255,255,255,.08); --text: rgba(255,255,255,.88);
    --dim: rgba(255,255,255,.45); --faint: rgba(255,255,255,.28); --accent: #7c9cff; --snap: #5b7cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 272px; height: 100vh; }
  .stage { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .help { position: absolute; left: 14px; bottom: 14px; width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid var(--line); color: var(--dim); display: grid; place-items: center; font-size: 11px; cursor: default; }
  .frame-box { position: relative; }
  .frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #f4f1ea; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 20px 60px rgba(0,0,0,.5); }
  .frame svg.overlay { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .frame svg.overlay.neutral { mix-blend-mode: difference; }
  .frame svg.overlay.mods { opacity: 0; transition: opacity .22s ease; }
  .frame svg.overlay.mods.on { opacity: 1; }
  .layer { position: absolute; cursor: grab; user-select: none; }
  .layer.sel { outline: 2px solid var(--accent); z-index: 4; }
  .layer:hover:not(.sel) { outline: 1px solid rgba(124,156,255,.6); }
  .layer .handle { display: none; position: absolute; right: -9px; bottom: -9px; width: 18px; height: 18px;
    background: #fff; border: 3px solid var(--accent); border-radius: 3px; cursor: nwse-resize; }
  .layer.sel .handle { display: block; }
  .l-head { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.035em; color: #151515; }
  .l-body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; color: #2a2a2a; }
  .bl { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
  .l-photo { background: linear-gradient(160deg, #f6a04d 0%, #e5543b 45%, #6d2a5c 100%); overflow: hidden; }
  .l-photo::after { content: ""; position: absolute; left: 50%; top: 58%; width: 46%; aspect-ratio: 1; transform: translate(-50%,-50%);
    border-radius: 50%; background: radial-gradient(circle, #ffe7a8 0 55%, rgba(255,231,168,0) 56%); }
  .l-btn { background: #151515; color: #f4f1ea; font: 600 30px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; border-radius: 999px; }
  .l-logo { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: .12em; color: #151515; }
  .badge { position: absolute; z-index: 10; pointer-events: none; background: var(--snap); color: #fff; font-size: 11px;
    font-weight: 600; padding: 2px 7px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -100%);
    font-variant-numeric: tabular-nums; }

  .panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; }
  .sec { padding: 14px 14px 16px; border-bottom: 1px solid var(--line); }
  .sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; min-height: 18px; }
  .sec-t { font-weight: 600; font-size: 12px; cursor: default; }
  .sec-h .end { display: flex; align-items: center; gap: 8px; }
  .sub { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 6px; font-size: 11px; color: var(--dim); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .field { display: flex; align-items: center; background: rgba(255,255,255,.04); border: 1px solid transparent;
    border-radius: 6px; height: 28px; padding: 0 8px; gap: 6px; }
  .field:focus-within { border-color: rgba(124,156,255,.6); }
  .field label { color: var(--faint); font-size: 11px; white-space: nowrap; }
  .field input { flex: 1; min-width: 0; width: 100%; background: none; border: 0; color: var(--text); font: inherit;
    text-align: right; outline: none; font-variant-numeric: tabular-nums; }
  .field input:disabled { color: var(--faint); }
  .field .u { color: var(--faint); font-size: 10px; }
  .seg { display: flex; background: rgba(255,255,255,.04); border-radius: 6px; padding: 2px; gap: 2px; margin-bottom: 6px; }
  .seg button { flex: 1; height: 24px; border: 0; background: none; color: var(--dim); font: inherit; font-size: 11px;
    border-radius: 4px; cursor: pointer; }
  .seg button.on { background: rgba(255,255,255,.1); color: var(--text); }
  .switch { position: relative; width: 28px; height: 16px; border-radius: 8px; background: rgba(255,255,255,.12);
    border: 0; cursor: pointer; padding: 0; flex: none; }
  .switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; transition: transform .15s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(12px); }
  .icon { background: none; border: 0; color: var(--dim); cursor: pointer; padding: 0; font-size: 14px; line-height: 1; }
  .icon:hover { color: var(--text); }
  .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .btn { height: 28px; border: 0; border-radius: 6px; background: rgba(255,255,255,.06); color: var(--text); font: inherit;
    font-size: 11px; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.on { background: rgba(124,156,255,.22); }
  .readout { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }
  #tip { position: fixed; z-index: 100; max-width: 220px; padding: 6px 8px; border-radius: 6px; background: #26262b;
    color: var(--text); font-size: 11px; line-height: 1.4; pointer-events: none; opacity: 0; transition: opacity .12s;
    box-shadow: 0 6px 20px rgba(0,0,0,.4); white-space: pre-line; }
  #tip.on { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="frame-box" id="frameBox"><div class="frame" id="frame"></div></div>
    <div class="help" data-tip="Drag to move, drag the corner to resize.&#10;⌥ while dragging places freely.&#10;⌃G shows or hides the grid.&#10;⌘Z undo, ⇧⌘Z redo.">?</div>
  </div>

  <aside class="panel">
    <div class="sec">
      <div class="sec-h"><span class="sec-t">Frame</span><span class="readout" id="sizeReadout"></span></div>
      <div class="seg" id="fmtSeg" style="margin:0"></div>
    </div>

    <div class="sec">
      <div class="sec-h">
        <span class="sec-t" data-tip="A guide for placing layers. Layers snap to it; it never appears in exports.">Layout grid</span>
        <span class="end">
          <button class="icon hidden" id="resetSug">↺</button>
          <button class="switch" id="showGrid" data-tip="Show grid  ⌃G"></button>
        </span>
      </div>

      <div class="sub" style="margin-top:0">Columns</div>
      <div class="row">
        <div class="field"><label>Count</label><input type="number" min="1" max="24" data-k="cols.count"></div>
        <div class="field"><label>Gutter</label><input type="number" min="0" max="400" data-k="cols.gutter" data-unit><span class="u">px</span></div>
      </div>
      <div class="seg" id="colType"></div>
      <div class="row">
        <div class="field"><label id="colMarginLbl">Margin</label><input type="number" min="0" max="800" data-k="cols.margin" data-unit><span class="u">px</span></div>
        <div class="field"><label>Width</label><input type="number" min="1" max="2000" data-k="cols.width" data-unit><span class="u">px</span></div>
      </div>

      <div class="sub"><span data-tip="Square makes rows as tall as the columns are wide, rounded to the baseline grid.">Rows</span></div>
      <div class="seg" id="rowMode"></div>
      <div class="row" id="rowFields">
        <div class="field"><label>Count</label><input type="number" min="1" max="24" data-k="rows.count"></div>
      </div>

      <div class="row" style="margin-top:12px">
        <div class="field" data-tip="The body text's line spacing. Type sizes, rows and the baseline grid (every half line) all come from it."><label>Line</label><input type="number" min="16" max="96" step="4" data-k="line"><span class="u">px</span></div>
      </div>
    </div>

    <div class="sec" id="layerSec">
      <div class="sec-h"><span class="sec-t" id="layerTitle" data-tip="Where the layer sits on the grid. Change a number to move or resize it.">Layer</span><span class="readout" id="layerReadout"></span></div>
      <div class="row">
        <div class="field"><label>Column</label><input type="number" min="1" id="colStart"></div>
        <div class="field"><label>Span</label><input type="number" min="1" id="colSpan"></div>
      </div>
      <div class="row" id="rowPlace">
        <div class="field"><label>Row</label><input type="number" min="1" id="rowStart"></div>
        <div class="field"><label>Span</label><input type="number" min="1" id="rowSpan"></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t" data-tip="Places the layers on the grid. The layout follows when the columns or the format change.">Layouts</span></div>
      <div class="btns" id="layoutBtns"></div>
    </div>
  </aside>
</div>
<div id="tip"></div>

<script>
// ── formats and the grid each one suggests ─────────────────────────────────
const FORMATS = [
  { id: 'square', label: '1:1', w: 1080, h: 1080, sug: { margin: 64 } },
  { id: 'portrait', label: '4:5', w: 1080, h: 1350, sug: { margin: 64 } },
  { id: 'story', label: '9:16', w: 1080, h: 1920, sug: { margin: 72 } },
  { id: 'wide', label: '16:9', w: 1920, h: 1080, sug: { margin: 96 } },
]
const fmtOf = id => FORMATS.find(f => f.id === id)
function suggestedGrid(fmt, keep) {
  const line = keep ? keep.line : 40
  return {
    show: keep ? keep.show : true,
    line,
    cols: { count: 12, type: 'stretch', margin: fmt.sug.margin, gutter: line / 2, width: 64 },
    rows: { mode: keep ? keep.rows.mode : 'square', count: 8 },
  }
}
const sameGrid = (a, b) => ['count', 'type', 'margin', 'gutter'].every(k => a.cols[k] === b.cols[k])

// ── state + history ─────────────────────────────────────────────────────────
let S = { fmt: 'portrait', grid: suggestedGrid(fmtOf('portrait')), layers: [], layout: 'photoTop' }
let sel = null
const undo = [], redo = []
const snap = () => JSON.stringify(S)
function record(before) { if (before !== snap()) { undo.push(before); redo.length = 0 } }
function restore(json) { S = JSON.parse(json); if (sel && !S.layers.find(l => l.id === sel)) sel = null; render() }

// ── geometry ────────────────────────────────────────────────────────────────
const F = () => fmtOf(S.fmt)
const L = () => S.grid.line
// The baseline grid: every half line, from the top of the frame.
const U = () => S.grid.line / 2
const toUnit = v => Math.round(v / U()) * U()
function tracks(n, type, margin, gutter, width, total) {
  let w, x0
  if (type === 'stretch') { w = (total - 2 * margin - (n - 1) * gutter) / n; x0 = margin }
  else { w = width; const all = n * w + (n - 1) * gutter; x0 = type === 'center' ? (total - all) / 2 : margin }
  return Array.from({ length: n }, (_, i) => ({ a: x0 + i * (w + gutter), w: Math.max(0, w) }))
}
const colTracks = () => { const c = S.grid.cols; return tracks(c.count, c.type, c.margin, c.gutter, c.width, F().w) }
// Rows live on the baseline grid: tops, heights and gaps are whole half-lines.
function rowTracks() {
  const r = S.grid.rows, c = S.grid.cols, H = F().h
  if (r.mode === 'off') return []
  const y0 = Math.max(U(), toUnit(c.margin)), gv = Math.max(U(), toUnit(c.gutter))
  let mh, n
  if (r.mode === 'count') {
    n = r.count
    mh = Math.max(U(), Math.floor((H - 2 * y0 + gv) / n / U()) * U() - gv)
  } else {
    mh = Math.max(U(), Math.round(colTracks()[0].w / U()) * U())
    n = Math.max(1, Math.floor((H - 2 * y0 + gv) / (mh + gv)))
  }
  return Array.from({ length: n }, (_, i) => ({ a: y0 + i * (mh + gv), w: mh }))
}
function lines(ts, extent) { const out = [0, extent]; for (const t of ts) out.push(t.a, t.a + t.w); return out }
const nearest = (v, ls) => ls.reduce((b, l) => (Math.abs(l - v) < Math.abs(b - v) ? l : b), ls[0])
function spanIn(ts, a, len) {
  if (!ts.length) return null
  let s = 0, e = 0
  ts.forEach((t, i) => {
    if (Math.abs(t.a - a) < Math.abs(ts[s].a - a)) s = i
    if (Math.abs(t.a + t.w - (a + len)) < Math.abs(ts[e].a + ts[e].w - (a + len))) e = i
  })
  return { start: s, span: Math.max(1, e - s + 1) }
}
function placeIn(ts, start, span) {
  start = Math.max(0, Math.min(ts.length - 1, start)); const end = Math.max(start, Math.min(ts.length - 1, start + span - 1))
  return [ts[start].a, ts[end].a + ts[end].w - ts[start].a]
}
// Horizontal lines worth snapping to: module tops and bottoms, the margins, the middle.
function hLines() {
  const H = F().h, m = Math.max(U(), toUnit(S.grid.cols.margin))
  return lines(rowTracks(), H).concat(H / 2, m, H - m)
}

// ── layers ──────────────────────────────────────────────────────────────────
// Type sizes come from the line: body capitals are half a line tall, headline capitals a line and a half.
const LAYERS = [
  { id: 'photo', name: 'Photo', cls: 'l-photo' },
  { id: 'head', name: '“Summer drop”', cls: 'l-head', text: 'Summer drop', type: { size: 2.1, lh: 2 } },
  { id: 'body', name: '“New colours, same fit…”', cls: 'l-body', text: 'New colours, same fit. In stores Friday.', type: { size: 0.7, lh: 1 } },
  { id: 'btn', name: '“Shop now”', cls: 'l-btn', text: 'Shop now' },
  { id: 'logo', name: '“NORTHWIND”', cls: 'l-logo', text: 'NORTHWIND', type: { size: 0.7, lh: 1 } },
]
const defOf = id => LAYERS.find(d => d.id === id)
// Measured text metrics, per layer: first baseline and cap height from the box top, line height, line count.
const M = {}
// The part of a layer the eye sees: capitals to last baseline for text, the box otherwise.
function vis(l) {
  const m = defOf(l.id).type && M[l.id]
  if (!m) return { top: l.y, bottom: l.y + l.h }
  return { top: l.y + m.base - m.cap, bottom: l.y + m.base + (m.lines - 1) * m.lh }
}
function setVisTop(l, top) { const m = defOf(l.id).type && M[l.id]; l.y = m ? top - (m.base - m.cap) : top }

// ── layouts (written in columns, so they follow the grid) ──────────────────
// [layer, first column, last column (0..1 of the count), top, height (0..1 of the height inside the margins)]
const LAYOUTS = {
  photoTop: { label: 'Photo top', rules: [
    ['logo', 0, 0.5, 0, 0], ['photo', 0, 1, 0.07, 0.5], ['head', 0, 0.84, 0.62, 0],
    ['body', 0, 0.5, 0.8, 0], ['btn', 0.67, 1, 0.9, 0.08] ] },
  split: { label: 'Split', rules: [
    ['photo', 0.5, 1, 0, 1], ['logo', 0, 0.5, 0, 0], ['head', 0, 0.5, 0.3, 0],
    ['body', 0, 0.42, 0.62, 0], ['btn', 0, 0.34, 0.9, 0.08] ] },
  bigType: { label: 'Big type', rules: [
    ['head', 0, 1, 0.02, 0], ['body', 0, 0.67, 0.3, 0], ['photo', 0, 1, 0.46, 0.4],
    ['logo', 0, 0.5, 0.94, 0], ['btn', 0.67, 1, 0.92, 0.08] ] },
}
function applyLayout(id) {
  const n = S.grid.cols.count, H = F().h, m = S.grid.cols.margin, inner = H - 2 * m
  const cs = colTracks(), rs = rowTracks(), tops = rs.map(r => r.a), bottoms = rs.map(r => r.a + r.w)
  S.layers = LAYOUTS[id].rules.map(([lid, c0, c1, t, h]) => {
    const s = Math.min(n - 1, Math.round(c0 * n)), e = Math.max(s, Math.round(c1 * n) - 1)
    const [x, w] = placeIn(cs, s, e - s + 1)
    let top = m + t * inner, b = top + h * inner
    // things start on a module top and end on a module bottom
    if (rs.length) { top = nearest(top, tops); if (h) b = Math.max(top + rs[0].w, nearest(b, bottoms)) } else { top = toUnit(top); b = toUnit(b) }
    if (h && t + h >= 0.999) b = rs.length ? rs[rs.length - 1].a + rs[rs.length - 1].w : H - m
    const l = { id: lid, x, y: 0, w, h: h ? Math.max(U(), b - top) : 0 }
    setVisTop(l, top)
    return l
  })
  S.layout = id
}

// ── render ──────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s)
const frame = $('#frame'), frameBox = $('#frameBox'), stage = $('#stage')
const ctx = document.createElement('canvas').getContext('2d')
let scale = 1, drag = null

function fit() {
  const r = stage.getBoundingClientRect(), pad = 48
  scale = Math.min((r.width - pad * 2) / F().w, (r.height - pad * 2) / F().h)
  frame.style.width = F().w + 'px'; frame.style.height = F().h + 'px'
  frame.style.transform = `scale(${scale})`
  frameBox.style.width = F().w * scale + 'px'; frameBox.style.height = F().h * scale + 'px'
}

// The overlay is three SVGs that stay in the Frame between renders (so the modules can fade):
// the column edges (always), the modules and baselines (only while a layer is moving), and the accent marks.
const moving = () => !!(drag && drag.moved)
function makeOverlay(cls) { const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); el.setAttribute('class', cls); return el }
const ovRest = makeOverlay('overlay neutral'), ovMods = makeOverlay('overlay neutral mods'), ovMarks = makeOverlay('overlay')
function renderOverlay() {
  const W = F().w, H = F().h, g = S.grid, px = 1 / scale
  for (const el of [ovRest, ovMods, ovMarks]) {
    el.setAttribute('viewBox', `0 0 ${W} ${H}`); el.setAttribute('width', W); el.setAttribute('height', H)
    el.style.display = g.show ? '' : 'none'
    frame.appendChild(el)
  }
  const cs = colTracks(), rs = rowTracks()
  // column edges, always, very faint
  let s = ''
  for (const x of [...new Set(cs.flatMap(c => [c.a, c.a + c.w]))])
    s += `<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="rgba(255,255,255,.09)" stroke-width="${px}"/>`
  ovRest.innerHTML = s
  // modules and baselines: built once per grid, faded in while a layer moves
  const key = JSON.stringify([S.fmt, g, scale])
  if (ovMods.dataset.key !== key) {
    s = ''
    const cells = rs.length ? cs.flatMap(c => rs.map(r => [c.a, r.a, c.w, r.w])) : cs.map(c => [c.a, 0, c.w, H])
    for (const [x, y, w, h] of cells)
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="${px}"/>`
    for (let y = U(); y < H; y += U())
      s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.12)" stroke-width="${px}"/>`
    ovMods.innerHTML = s; ovMods.dataset.key = key
  }
  ovMods.classList.toggle('on', moving())
  // accent marks: what the moving layer covers, snap lines, the selected text's capitals and baselines
  s = ''
  if (moving()) {
    const dv = vis(drag.layer)
    const hc = spanIn(cs, drag.layer.x, drag.layer.w), hr = spanIn(rs, dv.top, Math.max(1, dv.bottom - dv.top))
    const inC = i => i >= hc.start && i < hc.start + hc.span, inR = j => hr && j >= hr.start && j < hr.start + hr.span
    if (rs.length) cs.forEach((c, i) => rs.forEach((r, j) => { if (inC(i) && inR(j))
      s += `<rect x="${c.a}" y="${r.a}" width="${c.w}" height="${r.w}" fill="rgba(124,156,255,.22)"/>` }))
    else cs.forEach((c, i) => { if (inC(i)) s += `<rect x="${c.a}" y="0" width="${c.w}" height="${H}" fill="rgba(124,156,255,.18)"/>` })
    for (const gd of drag.guides)
      s += gd.axis === 'x'
        ? `<line x1="${gd.v}" x2="${gd.v}" y1="0" y2="${H}" stroke="#5b7cff" stroke-width="${1.5 * px}"/>`
        : `<line x1="0" x2="${W}" y1="${gd.v}" y2="${gd.v}" stroke="#5b7cff" stroke-width="${1.5 * px}"/>`
  }
  const l = S.layers.find(x => x.id === sel), m = l && defOf(l.id).type && M[l.id]
  if (m) {
    const capY = l.y + m.base - m.cap
    s += `<line x1="${l.x}" x2="${l.x + l.w}" y1="${capY}" y2="${capY}" stroke="#5b7cff" stroke-dasharray="${4 * px} ${3 * px}" stroke-width="${1.5 * px}"/>`
    for (let i = 0; i < m.lines; i++) { const by = l.y + m.base + i * m.lh
      s += `<line x1="${l.x}" x2="${l.x + l.w}" y1="${by}" y2="${by}" stroke="#5b7cff" stroke-width="${1.5 * px}"/>` }
  }
  ovMarks.innerHTML = s
}

// Draws the layers, then measures each text layer's baseline and capitals. Returns whether any metric moved.
function renderFrame() {
  fit()
  frame.querySelectorAll('.layer').forEach(el => el.remove())
  for (const l of S.layers) {
    const def = defOf(l.id)
    const el = document.createElement('div')
    el.className = `layer ${def.cls}${sel === l.id ? ' sel' : ''}`
    el.dataset.id = l.id
    Object.assign(el.style, { left: l.x + 'px', top: l.y + 'px', width: l.w + 'px' })
    if (def.type) { el.style.fontSize = def.type.size * L() + 'px'; el.style.lineHeight = def.type.lh * L() + 'px' }
    else el.style.height = l.h + 'px'
    if (def.text) el.innerHTML = (def.type ? '<span class="bl"></span>' : '') + def.text
    const hd = document.createElement('div'); hd.className = 'handle'
    hd.style.transform = `scale(${1 / scale})`; hd.style.transformOrigin = '100% 100%'
    el.appendChild(hd)
    el.addEventListener('pointerdown', e => startDrag(e, l, e.target === hd ? 'resize' : 'move'))
    frame.appendChild(el)
  }
  let moved = false
  for (const l of S.layers) {
    const def = defOf(l.id); if (!def.type) continue
    const el = frame.querySelector(`[data-id="${l.id}"]`), cs = getComputedStyle(el)
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`
    const lh = parseFloat(cs.lineHeight)
    const m = { base: el.querySelector('.bl').offsetTop, cap: ctx.measureText('H').actualBoundingBoxAscent, lh, lines: Math.max(1, Math.round(el.offsetHeight / lh)) }
    if (JSON.stringify(m) !== JSON.stringify(M[l.id])) moved = true
    M[l.id] = m; l.h = el.offsetHeight
  }
  renderOverlay()
  frameBox.querySelector('.badge')?.remove()
  if (moving()) {
    const l = drag.layer, v = vis(l), c = spanIn(colTracks(), l.x, l.w), r = spanIn(rowTracks(), v.top, Math.max(1, v.bottom - v.top))
    const b = document.createElement('div'); b.className = 'badge'
    b.textContent = r ? `${c.span} × ${r.span} modules` : `${c.span} ${c.span === 1 ? 'column' : 'columns'}`
    b.style.left = (l.x + l.w / 2) * scale + 'px'; b.style.top = v.top * scale - 6 + 'px'
    frameBox.appendChild(b)
  }
  return moved
}

function renderPanel() {
  const g = S.grid, f = F()
  $('#sizeReadout').textContent = `${f.w} × ${f.h}`
  $('#fmtSeg').innerHTML = FORMATS.map(x => `<button class="${x.id === S.fmt ? 'on' : ''}" data-fmt="${x.id}">${x.label}</button>`).join('')
  $('#colType').innerHTML = [['stretch', 'Stretch'], ['center', 'Center'], ['left', 'Left']]
    .map(([v, t]) => `<button class="${g.cols.type === v ? 'on' : ''}" data-type="${v}">${t}</button>`).join('')
  $('#rowMode').innerHTML = [['off', 'Off'], ['square', 'Square'], ['count', 'Count']]
    .map(([v, t]) => `<button class="${g.rows.mode === v ? 'on' : ''}" data-rows="${v}">${t}</button>`).join('')
  $('#showGrid').classList.toggle('on', g.show)
  document.querySelectorAll('input[data-k]').forEach(i => {
    if ('unit' in i.dataset) i.step = U()
    if (document.activeElement !== i) i.value = Math.round(get(i.dataset.k) * 10) / 10
  })
  const wIn = document.querySelector('[data-k="cols.width"]')
  wIn.disabled = g.cols.type === 'stretch'
  if (g.cols.type === 'stretch' && document.activeElement !== wIn) wIn.value = Math.round(colTracks()[0].w)
  $('#colMarginLbl').textContent = g.cols.type === 'left' ? 'Offset' : 'Margin'
  document.querySelector('[data-k="cols.margin"]').disabled = g.cols.type === 'center'
  $('#rowFields').classList.toggle('hidden', g.rows.mode !== 'count')
  const reset = $('#resetSug')
  reset.classList.toggle('hidden', sameGrid(g, suggestedGrid(f, g)))
  reset.dataset.tip = `Use the suggested grid for ${f.label}`

  const l = S.layers.find(x => x.id === sel)
  $('#layerSec').classList.toggle('hidden', !l)
  if (l) {
    const v = vis(l), c = spanIn(colTracks(), l.x, l.w), r = spanIn(rowTracks(), v.top, Math.max(1, v.bottom - v.top))
    $('#layerTitle').textContent = defOf(l.id).name
    $('#layerReadout').textContent = `${Math.round(l.x)}, ${Math.round(v.top)}`
    const put = (id, val) => { const i = $('#' + id); if (document.activeElement !== i) i.value = val }
    put('colStart', c.start + 1); put('colSpan', c.span)
    $('#rowPlace').classList.toggle('hidden', !r)
    if (r) { put('rowStart', r.start + 1); put('rowSpan', r.span) }
  }
  $('#layoutBtns').innerHTML = Object.entries(LAYOUTS).map(([id, x]) => `<button class="btn ${S.layout === id ? 'on' : ''}" data-layout="${id}">${x.label}</button>`).join('')
}
function render() {
  // type sizes follow the line, so a layout re-places its text once the new sizes are measured
  if (renderFrame() && S.layout && !drag) { applyLayout(S.layout); renderFrame() }
  renderPanel()
}

const get = path => path.split('.').reduce((o, k) => o[k], S.grid)
function set(path, v) { const ks = path.split('.'), last = ks.pop(); ks.reduce((o, k) => o[k], S.grid)[last] = v }

// ── dragging ────────────────────────────────────────────────────────────────
// Boxes snap an edge to a grid line. Text snaps what you see: its capitals to a module top, or its
// last baseline to a module bottom; otherwise its baseline stays on the baseline grid.
function snapBox(a, len, ls, th, guides, axis, both, fallback) {
  const n1 = nearest(a, ls), n2 = nearest(a + len, ls), d1 = Math.abs(n1 - a), d2 = Math.abs(n2 - a - len)
  if (Math.min(d1, both ? d2 : Infinity) < th) {
    if (!both || d1 <= d2) { guides.push({ axis, v: n1 }); return n1 }
    guides.push({ axis, v: n2 }); return n2 - len
  }
  return fallback(a)
}
function snapText(l, y, th, guides) {
  const m = M[l.id], capOff = m.base - m.cap, lastOff = m.base + (m.lines - 1) * m.lh
  const rs = rowTracks(), H = F().h, mg = Math.max(U(), toUnit(S.grid.cols.margin))
  const tops = rs.map(r => r.a).concat(mg), bottoms = rs.map(r => r.a + r.w).concat(H - mg)
  const nc = nearest(y + capOff, tops), dc = Math.abs(nc - y - capOff)
  const nb = nearest(y + lastOff, bottoms), db = Math.abs(nb - y - lastOff)
  if (Math.min(dc, db) < th) {
    if (dc <= db) { guides.push({ axis: 'y', v: nc }); return nc - capOff }
    guides.push({ axis: 'y', v: nb }); return nb - lastOff
  }
  return toUnit(y + m.base) - m.base
}
function startDrag(e, l, mode) {
  e.preventDefault(); e.stopPropagation()
  sel = l.id
  drag = { layer: l, mode, before: snap(), sx: e.clientX, sy: e.clientY, o: { ...l }, guides: [], moved: false }
  const def = defOf(l.id)
  const move = ev => {
    if (!drag.moved) {
      if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 4) return
      drag.moved = true; S.layout = null
    }
    const dx = (ev.clientX - drag.sx) / scale, dy = (ev.clientY - drag.sy) / scale
    const free = ev.altKey, th = 10 / scale, guides = []
    const xs = lines(colTracks(), F().w).concat(F().w / 2), ys = hLines()
    if (mode === 'move') {
      const x = drag.o.x + dx, y = drag.o.y + dy
      l.x = free ? Math.round(x) : snapBox(x, l.w, xs, th, guides, 'x', true, Math.round)
      l.y = free ? Math.round(y) : def.type ? snapText(l, y, th, guides) : snapBox(y, l.h, ys, th, guides, 'y', true, toUnit)
    } else {
      const r = drag.o.x + drag.o.w + dx, b = drag.o.y + drag.o.h + dy
      l.w = Math.max(U() * 4, (free ? Math.round(r) : snapBox(r, 0, xs, th, guides, 'x', false, Math.round)) - l.x)
      if (!def.type) l.h = Math.max(U() * 2, (free ? Math.round(b) : snapBox(b, 0, ys, th, guides, 'y', false, toUnit)) - l.y)
    }
    drag.guides = S.grid.show ? guides : []
    render()
  }
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up)
    const b = drag.before; drag = null; record(b); render()
  }
  addEventListener('pointermove', move); addEventListener('pointerup', up)
  render()
}
stage.addEventListener('pointerdown', e => { if (!e.target.closest('.layer, .help')) { sel = null; render() } })

// ── panel events ────────────────────────────────────────────────────────────
let editBefore = null
document.addEventListener('focusin', e => { if (e.target.matches('.panel input')) editBefore = snap() })
document.addEventListener('focusout', e => {
  const i = e.target
  if (!i.matches('.panel input')) return
  if (i.dataset.k === 'line') S.grid.line = Math.max(16, Math.round(S.grid.line / 4) * 4)
  if (S.layout) applyLayout(S.layout)
  render()
  if (editBefore) { record(editBefore); editBefore = null }
})
document.querySelectorAll('input[data-k]').forEach(i => i.addEventListener('input', () => {
  const v = Number(i.value); if (i.value === '' || !Number.isFinite(v)) return
  const b = editBefore ?? snap()
  set(i.dataset.k, Math.max(Number(i.min || 0), Math.min(Number(i.max || 9999), v)))
  if (S.layout) applyLayout(S.layout)
  if (!editBefore) record(b)
  render()
}))
for (const id of ['colStart', 'colSpan', 'rowStart', 'rowSpan']) $('#' + id).addEventListener('input', () => {
  const l = S.layers.find(x => x.id === sel); if (!l) return
  const cs = Number($('#colStart').value) - 1, cn = Number($('#colSpan').value)
  if (cs >= 0 && cn >= 1) [l.x, l.w] = placeIn(colTracks(), cs, cn)
  const rs = rowTracks(), rStart = Number($('#rowStart').value) - 1, rn = Number($('#rowSpan').value)
  if (rs.length && id.startsWith('row') && rStart >= 0 && rn >= 1) {
    const [y, h] = placeIn(rs, rStart, rn); setVisTop(l, y)
    if (!defOf(l.id).type) l.h = h
  }
  S.layout = null; render()
})
document.querySelector('.panel').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return
  const b = snap(), f = F()
  if (t.dataset.fmt) {
    const nf = fmtOf(t.dataset.fmt), wasSug = sameGrid(S.grid, suggestedGrid(f, S.grid))
    if (!S.layout) for (const l of S.layers) { l.x *= nf.w / f.w; l.w *= nf.w / f.w; l.y *= nf.h / f.h; l.h *= nf.h / f.h }
    S.fmt = nf.id
    // an untouched grid moves to the new format's suggestion; a grid you set stays yours
    if (wasSug) S.grid = suggestedGrid(nf, S.grid)
  } else if (t.dataset.type) {
    if (t.dataset.type !== 'stretch' && S.grid.cols.type === 'stretch') S.grid.cols.width = Math.round(colTracks()[0].w)
    S.grid.cols.type = t.dataset.type
  } else if (t.dataset.rows) S.grid.rows.mode = t.dataset.rows
  else if (t.id === 'showGrid') S.grid.show = !S.grid.show
  else if (t.id === 'resetSug') S.grid = suggestedGrid(f, S.grid)
  else if (t.dataset.layout) S.layout = t.dataset.layout
  else return
  if (S.layout) applyLayout(S.layout)
  record(b); render()
})
addEventListener('keydown', e => {
  if (e.target.matches('input')) return
  if (e.ctrlKey && !e.metaKey && e.key.toLowerCase() === 'g') { e.preventDefault(); const b = snap(); S.grid.show = !S.grid.show; record(b); render() }
  if (e.metaKey && e.key.toLowerCase() === 'z') {
    e.preventDefault()
    if (e.shiftKey) { if (redo.length) { undo.push(snap()); restore(redo.pop()) } }
    else if (undo.length) { redo.push(snap()); restore(undo.pop()) }
  }
  if (e.key === 'Escape' && sel) { sel = null; render() }
})
addEventListener('resize', render)

// ── tooltips ────────────────────────────────────────────────────────────────
const tip = $('#tip'); let tipTimer = null
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]'); clearTimeout(tipTimer); tip.classList.remove('on')
  if (!t || drag) return
  tipTimer = setTimeout(() => {
    tip.textContent = t.dataset.tip
    const r = t.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight
    let x = r.left, y = r.bottom + 6
    if (x + tw > innerWidth - 8) x = innerWidth - 8 - tw
    if (y + th > innerHeight - 8) y = r.top - th - 6
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px'
    tip.classList.add('on')
  }, 450)
})

applyLayout('photoTop')
render()
// fonts can land after the first paint; measure again once they have
document.fonts.ready.then(render)
</script>
</body>
</html>
