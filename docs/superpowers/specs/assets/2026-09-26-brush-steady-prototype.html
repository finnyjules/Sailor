<title>Steady Brush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #121117;
    --panel: #1c1a22;
    --line: #2d2a35;
    --ink: #efeaf4;
    --muted: #9a93a6;
    --accent: #d8c7ff;
    --accent-ink: #1a1424;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-inline: 16px;
    padding-block: 14px;
    box-sizing: border-box;
  }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .name { font: 800 22px/1 "Bricolage Grotesque", ui-sans-serif, sans-serif; letter-spacing: -0.01em; }
  .tag { color: var(--muted); font-size: 13px; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: 600 13px/1 "Hanken Grotesk", sans-serif; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .tools label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; }
  .tools input[type="range"] { width: 120px; accent-color: var(--accent); }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font: 600 13px/1 "Hanken Grotesk", sans-serif; padding: 9px 14px; border-radius: 999px; cursor: pointer;
  }
  .btn:hover, .chip:hover { border-color: #4a4555; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 40px; }
  .chip {
    appearance: none; display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font: 500 13px/1 "Hanken Grotesk", sans-serif; padding: 5px 12px 5px 5px; border-radius: 999px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .sw { width: 26px; height: 26px; border-radius: 50%; flex: none; }
  .divider { width: 1px; height: 24px; background: var(--line); margin-inline: 4px; }
  .dot {
    appearance: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  .dot[aria-pressed="true"] { border-color: var(--ink); }
  .tune { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 18px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding-block: 10px; padding-inline: 14px; }
  .tune label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12px; color: var(--muted); }
  .tune label b { color: var(--ink); font-weight: 600; }
  .tune output { font-variant-numeric: tabular-nums; color: var(--ink); }
  .tune input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
  .tune .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; grid-column: span 2; }
  .tune .note { font-size: 12px; color: var(--muted); }
  .stage {
    position: relative; flex: 1; min-height: 280px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line); background: #000;
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  .ring {
    position: absolute; left: 0; top: 0; pointer-events: none; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.9); box-shadow: 0 0 0 1px rgba(0,0,0,0.45);
    transform: translate(-50%, -50%); opacity: 0; transition: opacity .15s;
  }
  .stage:hover .ring { opacity: 1; }
  .hint { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .hint b { color: var(--ink); font-weight: 600; }
  .stage canvas.ov { pointer-events: none; cursor: none; }
  .snaptag { position: absolute; left: 0; top: 0; pointer-events: none; transform: translate(14px, -34px);
    background: var(--accent); color: var(--accent-ink); font: 600 12px/1 "Hanken Grotesk", sans-serif;
    padding: 6px 10px; border-radius: 999px; box-shadow: 0 2px 10px rgba(0,0,0,.35); transition: opacity .2s; }
  .tune .seg { justify-self: start; }
  .tune .seg button { padding: 6px 11px; font-size: 12px; }
  .tune .grp { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .tune .grp b { color: var(--ink); font-weight: 600; }
  .nogl { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="name">Steady brush</span><span class="tag">Steadying and hold-to-snap · Frame paint prototype</span></div>
    <div class="seg" role="group" aria-label="What the brush paints">
      <button id="mode-material" aria-pressed="true">Paint with a material</button>
      <button id="mode-effect" aria-pressed="false">Paint an effect</button>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Tip">
        <button id="tip-spray" aria-pressed="true">Spray can</button>
        <button id="tip-round" aria-pressed="false">Round</button>
        <button id="tip-brush" aria-pressed="false">Bristle</button>
      </div>
      <label for="size">Size <input id="size" type="range" min="6" max="120" value="44"></label>
      <div class="seg" role="group" aria-label="Surface">
        <button id="bg-photo" aria-pressed="true">Photo</button>
        <button id="bg-paper" aria-pressed="false">Paper</button>
      </div>
      <button class="btn" id="undo">Undo</button>
      <button class="btn" id="clear">Clear</button>
    </div>
  </header>
  <div class="row" id="chips-material"></div>
  <div class="row" id="chips-effect" hidden></div>
  <div class="tune" id="tune-phys"></div>
  <div class="tune" id="tune-steady"></div>
  <div class="tune" id="tune" hidden></div>
  <main class="stage" id="stage">
    <canvas id="c"></canvas>
    <canvas id="ov" class="ov"></canvas>
    <div class="ring" id="ring"></div>
    <div class="snaptag" id="snaptag" hidden></div>
  </main>
  <footer class="hint" id="hint"></footer>
</div>

<script>
(() => {
  // ---------- catalogue ----------
  const MATERIALS = [
    { id: 0, name: 'Paint', sw: '', load: 1.0, geo: 1 },
    { id: 1, name: 'Holographic foil', sw: 'conic-gradient(from 30deg, #ffd1f0, #c9d8ff, #bff5e6, #fff3b8, #ffc9d9, #ffd1f0)', load: 0.6, geo: 1 },
    { id: 2, name: 'Liquid chrome', sw: 'linear-gradient(160deg, #f6f8ff 0 35%, #545a66 48%, #d9dde6 60%, #1b1d22 100%)', load: 0.5, geo: 1 },
    { id: 3, name: 'Lava', sw: 'radial-gradient(circle at 40% 40%, #ffe07a, #ff5a12 45%, #2a0f0a 80%)', load: 0.4, geo: 1 },
    { id: 4, name: 'Marbled ink', sw: 'linear-gradient(135deg, #0e1440, #1d6d7a 55%, #efe3cf 62%, #122050)', load: 0.8, geo: 1 },
    { id: 5, name: 'Neon', sw: 'radial-gradient(circle, #fff 0 18%, #ff4fd8 35%, rgba(255,79,216,0.15) 70%), #1a0f22', load: 0, geo: 2.4 },
    { id: 6, name: 'Oil slick', sw: 'linear-gradient(120deg, #050507 20%, #6b2cff 40%, #16c7a8 55%, #ffb000 68%, #050507 85%)', load: 0.6, geo: 1 },
  ];
  const COLORS = ['#e4572e', '#f3b61f', '#2e6fdb', '#1b998b', '#f1ece2', '#1d1a23'];
  const EFFECTS = [
    { ch: 0, name: 'Ripple', sw: 'repeating-radial-gradient(circle at 50% 50%, #7fb8ff 0 3px, #22406e 3px 6px)' },
    { ch: 1, name: 'Reeded glass', sw: 'repeating-linear-gradient(90deg, #cfe6ff 0 3px, #5d7ea8 3px 5px, #eaf4ff 5px 6px)' },
    { ch: 2, name: 'Glow', sw: 'radial-gradient(circle, #fff6d6 0 20%, #ffb35c 45%, #3a1d10 80%)' },
    { ch: 3, name: 'Dither', sw: 'repeating-conic-gradient(#f5ead4 0 25%, #1c1a3a 0 50%) 0 0 / 6px 6px' },
    { ch: 4, name: 'Colour split', sw: 'linear-gradient(90deg, #ff3b5c 0 33%, #3bff9d 33% 66%, #3b6bff 66%)' },
    { ch: 5, name: 'Pixels', sw: 'conic-gradient(#b94a7c 0 25%, #f5a35a 0 50%, #5b2d63 0 75%, #ffd08a 0) 0 0 / 13px 13px' },
    { ch: 6, name: 'Frost', sw: 'radial-gradient(circle at 35% 35%, #ffffff, #cfd9e6 55%, #8d9bb0)' },
  ];

  // Defaults tuned by hand on 2026-09-26
  const PHYS_DEFAULTS = {
    spray: { speckle: 0.25, overspray: 0.2, drips: 1.75, build: 2, relief: 0 },
    round: { softness: 2, overspray: 2, grain: 2, smoothing: 2, relief: 0.05 },
    brush: { thin: 0.15, taper: 0.2, dry: 0.65, load: 0, bristle: 0.5, relief: 0.35, smoothing: 0.6 },
  };
  const state = {
    mode: 'material', mat: 1, color: COLORS[0], effect: 1, surface: 'photo',
    tune: [1, 1, 1, 1, 1, 1, 1], buildUp: 1,
    phys: JSON.parse(JSON.stringify(PHYS_DEFAULTS)),
    tip: 'spray', size: { spray: 110, round: 36, 'brush-material': 44, 'brush-effect': 130 },
  };

  const sizeKey = () => state.tip === 'brush' ? 'brush-' + state.mode : state.tip;
  // ---------- UI ----------
  const $ = (id) => document.getElementById(id);
  const chipsM = $('chips-material'), chipsE = $('chips-effect');
  function chip(label, bg, onClick) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.innerHTML = `<span class="sw"></span><span></span>`;
    b.firstChild.style.background = bg;
    b.lastChild.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }
  const matChips = MATERIALS.map((m) => {
    const c = chip(m.name, m.sw || state.color, () => { state.mat = m.id; syncUI(); });
    chipsM.appendChild(c); return c;
  });
  const divider = document.createElement('span'); divider.className = 'divider'; chipsM.appendChild(divider);
  const dots = COLORS.map((col) => {
    const d = document.createElement('button');
    d.className = 'dot'; d.style.background = col; d.setAttribute('aria-label', 'Paint colour ' + col);
    d.addEventListener('click', () => { state.color = col; syncUI(); });
    chipsM.appendChild(d); return d;
  });
  const fxChips = EFFECTS.map((f) => {
    const c = chip(f.name, f.sw, () => { state.effect = f.ch; syncUI(); });
    chipsE.appendChild(c); return c;
  });
  const tuneEl = $('tune');
  try { const saved = JSON.parse(localStorage.getItem('shader-brush-tune') || 'null'); if (saved && saved.tune && saved.tune.length === 7) { state.tune = saved.tune; state.buildUp = saved.buildUp || 1; } } catch (e) {}
  const saveTune = () => { try { localStorage.setItem('shader-brush-tune', JSON.stringify({ tune: state.tune, buildUp: state.buildUp })); } catch (e) {} };
  function slider(id, label, value, max, onInput) {
    const l = document.createElement('label');
    l.htmlFor = id;
    l.innerHTML = `<b></b><output></output><input id="${id}" type="range" min="0" max="${max}" step="5">`;
    l.querySelector('b').textContent = label;
    const inp = l.querySelector('input'), out = l.querySelector('output');
    const show = () => { out.textContent = inp.value + '%'; };
    inp.value = Math.round(value * 100); show();
    inp.addEventListener('input', () => { show(); onInput(+inp.value / 100); saveTune(); });
    tuneEl.appendChild(l);
    return inp;
  }
  const tuneInputs = EFFECTS.map((f) => slider('tune-' + f.ch, f.name, state.tune[f.ch], 400, (v) => { state.tune[f.ch] = v; }));
  const buildInput = slider('tune-build', 'Build-up speed', state.buildUp, 300, (v) => { state.buildUp = v; });
  const actions = document.createElement('div'); actions.className = 'actions';
  actions.innerHTML = '<button class="btn" id="tune-copy">Copy values</button><button class="btn" id="tune-reset">Reset</button><span class="note" id="tune-note"></span>';
  tuneEl.appendChild(actions);
  $('tune-copy').onclick = () => {
    const txt = 'Effect strengths: ' + EFFECTS.map((f) => `${f.name} ${Math.round(state.tune[f.ch] * 100)}%`).join(', ') + `. Build-up speed ${Math.round(state.buildUp * 100)}%.`;
    const done = () => { $('tune-note').textContent = 'Copied. Paste it to Claude.'; };
    try { navigator.clipboard.writeText(txt).then(done, () => { $('tune-note').textContent = txt; }); } catch (e) { $('tune-note').textContent = txt; }
  };
  $('tune-reset').onclick = () => {
    state.tune = [1, 1, 1, 1, 1, 1, 1]; state.buildUp = 1;
    tuneInputs.forEach((i) => { i.value = 100; i.dispatchEvent(new Event('input')); });
    buildInput.value = 100; buildInput.dispatchEvent(new Event('input'));
    $('tune-note').textContent = '';
  };
  // Physics tuning for the two tips
  const PHYS = {
    spray: [['speckle', 'Speckle'], ['overspray', 'Overspray'], ['drips', 'Drips'], ['build', 'Build-up'], ['relief', 'Relief']],
    round: [['softness', 'Softness'], ['overspray', 'Overspray'], ['grain', 'Grain'], ['smoothing', 'Smoothing'], ['relief', 'Relief']],
    brush: [['thin', 'Speed thinning'], ['taper', 'Taper'], ['dry', 'Dry brush'], ['load', 'Runs out of paint'], ['bristle', 'Bristle texture'], ['relief', 'Paint thickness'], ['smoothing', 'Smoothing']],
  };
  try { const sp = JSON.parse(localStorage.getItem('shader-brush-phys-v2') || 'null'); if (sp && sp.spray && sp.brush) { Object.assign(state.phys.spray, sp.spray); Object.assign(state.phys.brush, sp.brush); if (sp.round) Object.assign(state.phys.round, sp.round); } } catch (e) {}
  const physEl = $('tune-phys');
  const physInputs = [];
  function buildPhys() {
    physEl.innerHTML = '';
    physInputs.length = 0;
    const tip = state.tip, P = state.phys[tip];
    for (const [key, label] of PHYS[tip]) {
      const l = document.createElement('label');
      l.htmlFor = 'phys-' + key;
      l.innerHTML = `<b></b><output></output><input id="phys-${key}" type="range" min="0" max="${tip === 'round' ? 400 : 200}" step="5">`;
      l.querySelector('b').textContent = label;
      const inp = l.querySelector('input'), out = l.querySelector('output');
      inp.value = Math.round(P[key] * 100); out.textContent = inp.value + '%';
      inp.addEventListener('input', () => {
        out.textContent = inp.value + '%'; P[key] = +inp.value / 100;
        try { localStorage.setItem('shader-brush-phys-v2', JSON.stringify(state.phys)); } catch (e) {}
        if (tip === 'brush') rebuildRibbons();
      });
      physEl.appendChild(l); physInputs.push(inp);
    }
    const act = document.createElement('div'); act.className = 'actions';
    act.innerHTML = `<button class="btn" id="phys-copy">Copy values</button><button class="btn" id="phys-reset">Reset</button><span class="note" id="phys-note">${({ brush: 'Changes strokes already painted.', spray: 'Relief changes paint already down. The rest applies to your next spray.', round: 'Grain and relief change strokes already painted. The rest applies to your next stroke.' })[tip]}</span>`;
    physEl.appendChild(act);
    $('phys-copy').onclick = () => {
      const txt = ({ brush: 'Bristle: ', spray: 'Spray can: ', round: 'Round: ' })[tip] + PHYS[tip].map(([k, lab]) => `${lab} ${Math.round(P[k] * 100)}%`).join(', ') + '.';
      const note = $('phys-note');
      try { navigator.clipboard.writeText(txt).then(() => { note.textContent = 'Copied. Paste it to Claude.'; }, () => { note.textContent = txt; }); } catch (e) { note.textContent = txt; }
    };
    $('phys-reset').onclick = () => { PHYS[tip].forEach(([k], j) => { physInputs[j].value = Math.round(PHYS_DEFAULTS[tip][k] * 100); physInputs[j].dispatchEvent(new Event('input')); }); };
  }
  // ---------- steadying: tuning panel ----------
  const STEADY_DEFAULTS = { on: true, streamline: 0.3, stabilise: 0.15, filter: 0.4, snap: true, hold: 0.5, hand: true };
  state.steady = { ...STEADY_DEFAULTS };
  try { const sv = JSON.parse(localStorage.getItem('steady-brush-v1') || 'null'); if (sv) Object.assign(state.steady, sv); } catch (e) {}
  const saveSteady = () => { try { localStorage.setItem('steady-brush-v1', JSON.stringify(state.steady)); } catch (e) {} };
  const steadyEl = $('tune-steady');
  function toggle(label, key, onTxt, offTxt, tip) {
    const g = document.createElement('div'); g.className = 'grp'; g.title = tip;
    g.innerHTML = `<b></b><div class="seg"><button>${onTxt}</button><button>${offTxt}</button></div>`;
    g.querySelector('b').textContent = label;
    const [a, b] = g.querySelectorAll('button');
    const show = () => { a.setAttribute('aria-pressed', !!state.steady[key]); b.setAttribute('aria-pressed', !state.steady[key]); };
    a.onclick = () => { state.steady[key] = true; show(); saveSteady(); };
    b.onclick = () => { state.steady[key] = false; show(); saveSteady(); };
    show(); steadyEl.appendChild(g); return show;
  }
  function steadySlider(key, label, fmt, tip) {
    const l = document.createElement('label'); l.htmlFor = 'steady-' + key; l.title = tip;
    l.innerHTML = `<b></b><output></output><input id="steady-${key}" type="range" min="0" max="100" step="5">`;
    l.querySelector('b').textContent = label;
    const inp = l.querySelector('input'), out = l.querySelector('output');
    const show = () => { inp.value = Math.round(state.steady[key] * 100); out.textContent = fmt(state.steady[key]); };
    inp.addEventListener('input', () => { state.steady[key] = +inp.value / 100; out.textContent = fmt(state.steady[key]); saveSteady(); });
    show(); steadyEl.appendChild(l); return show;
  }
  const pct = (v) => Math.round(v * 100) + '%';
  const holdMs = () => Math.round(250 + state.steady.hold * 750);
  const steadyShows = [
    toggle('Steadying', 'on', 'On', 'Off', 'Turn it off to feel the raw stroke. Compare on and off.'),
    steadySlider('streamline', 'StreamLine', pct, 'The line trails your finger a little and catches up, so curves come out smooth.'),
    steadySlider('stabilise', 'Stabilisation', pct, 'Averages the path, so slow careful strokes lose their wobble.'),
    steadySlider('filter', 'Motion filtering', pct, 'Removes small jitter without adding lag to fast strokes.'),
    toggle('Hold to snap', 'snap', 'On', 'Off', 'Round and Bristle: stop at the end of a stroke and keep holding. It snaps to a line, arc, ellipse or shape. Keep holding and move to adjust; Shift makes a circle or a 15° line.'),
    steadySlider('hold', 'Hold time', () => (holdMs() / 1000).toFixed(2) + ' s', 'How long to hold still before it snaps.'),
    toggle('Show my hand', 'hand', 'On', 'Off', 'Draws where your finger actually went, next to the steadied line.'),
  ];
  {
    const act = document.createElement('div'); act.className = 'actions';
    act.innerHTML = '<button class="btn" id="steady-copy">Copy values</button><button class="btn" id="steady-reset">Reset</button><span class="note" id="steady-note"></span>';
    steadyEl.appendChild(act);
    $('steady-copy').onclick = () => {
      const S = state.steady;
      const txt = `Steadying ${S.on ? 'on' : 'off'}: StreamLine ${pct(S.streamline)}, Stabilisation ${pct(S.stabilise)}, Motion filtering ${pct(S.filter)}. Hold to snap ${S.snap ? 'on' : 'off'}, hold time ${(holdMs() / 1000).toFixed(2)} s.`;
      const note = $('steady-note');
      try { navigator.clipboard.writeText(txt).then(() => { note.textContent = 'Copied. Paste it to Claude.'; }, () => { note.textContent = txt; }); } catch (e) { note.textContent = txt; }
    };
    $('steady-reset').onclick = () => { Object.assign(state.steady, STEADY_DEFAULTS); steadyShows.forEach((f) => f()); saveSteady(); $('steady-note').textContent = ''; };
  }

  let rebuildRibbons = () => {};
  const sizeEl = $('size');
  function syncUI() {
    const m = state.mode;
    $('mode-material').setAttribute('aria-pressed', m === 'material');
    $('mode-effect').setAttribute('aria-pressed', m === 'effect');
    chipsM.hidden = m !== 'material';
    chipsE.hidden = m !== 'effect';
    tuneEl.hidden = m !== 'effect';
    if (physEl.dataset.tip !== state.tip) { physEl.dataset.tip = state.tip; buildPhys(); }
    matChips.forEach((c, i) => c.setAttribute('aria-pressed', state.mat === i));
    matChips[0].firstChild.style.background = state.color;
    const showDots = state.mat === 0;
    divider.hidden = !showDots; dots.forEach((d) => { d.hidden = !showDots; d.setAttribute('aria-pressed', d.style.background && COLORS[dots.indexOf(d)] === state.color); });
    fxChips.forEach((c, i) => c.setAttribute('aria-pressed', state.effect === i));
    $('bg-photo').setAttribute('aria-pressed', state.surface === 'photo');
    $('bg-paper').setAttribute('aria-pressed', state.surface === 'paper');
    const k = sizeKey(), R = { spray: [30, 280], round: [4, 160], 'brush-material': [6, 120], 'brush-effect': [30, 320] }[k];
    sizeEl.min = R[0]; sizeEl.max = R[1]; sizeEl.value = state.size[k];
    $('tip-spray').setAttribute('aria-pressed', state.tip === 'spray');
    $('tip-brush').setAttribute('aria-pressed', state.tip === 'brush');
    $('tip-round').setAttribute('aria-pressed', state.tip === 'round');
    const HINTS = {
      'spray-material': '<span><b>Hold still</b> and the paint pools, then drips.</span><span><b>Move fast</b> for a light dusting.</span><span>Size sets how wide the can sprays.</span>',
      'spray-effect': '<span>The effect goes on in speckles. <b>Hold still</b> to fill it in, and it drips.</span><span>Every effect keeps its own sprayed area, so they stack.</span>',
      'round-material': '<span>A clean round brush with a little overspray and grain at the edges.</span><span><b>Go over it again</b> to fill the grain in.</span>',
      'round-effect': '<span>Paints the effect with a clean round edge and a little grain.</span><span><b>Go over it again</b> to make it stronger.</span>',

      if (!L.strokes.length) { items.splice(items.indexOf(L), 1); gl.deleteTexture(L.tex); gl.deleteFramebuffer(L.fb); if (L.ptex) { gl.deleteTexture(L.ptex); gl.deleteFramebuffer(L.pfb); } } else rasterLayer(L);
    } else { maskStrokes.splice(maskStrokes.indexOf(st), 1); rasterMasks(); }
  }
  $('undo').onclick = undo;
  $('clear').onclick = () => { if (down) return; while (history.length) undo(); };
  window.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } });

  function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }

  // ---------- opening state: a few strokes already on the photo ----------
  function seed() {
    const m = Math.min(W, H), sx = W * 0.66, sy = H * 0.6 - m * 0.03, sr = m * 0.2;
    const fx = (ch, size, path) => { cur = { kind: 'mask', ch, size, dabs: [] }; for (const [x, y, k] of path) stamp(x, y, k); maskStrokes.push(cur); history.push(cur); cur = null; };
    const glass = [];
    for (let c = 0; c < 6; c++) { const x = sx - sr * 1.05 + c * sr * 0.42; for (let y = sy - sr * 1.15; y < sy + sr * 0.35; y += 8) glass.push([x, y, 1.6]); }
    fx(1, 90, glass);
    const rip = [];
    for (const yy of [0.74, 0.86]) for (let x = W * 0.3; x < W * 0.98; x += 10) rip.push([x, H * yy + Math.sin(x * 0.02) * 6, 1.4]);
    fx(0, 110, rip);
    const spray = (mat, hex, size, f, secs, dwell) => {
      const layer = makeLayer(mat, hex), st = newSpray(layer, 0, size);
      layer.strokes.push(st);
      let prev = f(0);
      const N = Math.round(secs * 60);
      for (let i = 1; i <= N; i++) { const q = f(i / N); sprayTick(st, { x: prev[0], y: prev[1] }, { x: q[0], y: q[1] }, 1 / 60); prev = q; }
      for (let i = 0; i < dwell * 60; i++) sprayTick(st, { x: prev[0], y: prev[1] }, { x: prev[0], y: prev[1] }, 1 / 60);
      flush(st); history.push(st);
    };
    spray(1, COLORS[0], Math.max(60, m * 0.16), (t) => [W * (0.07 + 0.45 * t), H * (0.8 + 0.06 * Math.sin(t * 10))], 2.6, 1.1);
    spray(5, COLORS[0], Math.max(30, m * 0.07), (t) => [sx + Math.cos(Math.PI * (0.95 + 1.7 * t)) * sr * 1.4, sy + Math.sin(Math.PI * (0.95 + 1.7 * t)) * sr * 1.4], 1.8, 0);
    spray(2, COLORS[0], Math.max(40, m * 0.09), (t) => [W * (0.07 + 0.36 * t), H * 0.42 + Math.sin(t * 3) * m * 0.02], 1.3, 0.9);
  }

  // ---------- loop ----------
  let lastNow = performance.now();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now) {
    steadyFrame(now);
    const t = now / 1000 * (reduce ? 0.15 : 1);
    const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
    const active = new Set(drips.map((d) => d.st));
    if (down && cur && cur.kind === 'spray') { active.add(cur); sprayTick(cur, prevNozzle, nozzle, dt); prevNozzle = { ...nozzle }; }
    updateDrips(dt);
    for (const st of active) flush(st);
    if (down && cur && cur.kind === 'mask' && !snap && !releasing && performance.now() - lastMoveT > 40) stamp(lazy.x, lazy.y, 0.35);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cvs.width, cvs.height);
    gl.disable(gl.BLEND);
    gl.useProgram(compProg.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bgTex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, masks[0].tex);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, masks[1].tex);
    gl.uniform1i(compProg.u.uBg, 0); gl.uniform1i(compProg.u.uMA, 1); gl.uniform1i(compProg.u.uMB, 2);
    gl.uniform2f(compProg.u.uDev, cvs.width, cvs.height);
    gl.uniform2f(compProg.u.uCss, W, H);
    gl.uniform1f(compProg.u.uTime, t);
    gl.uniform1fv(compProg.u['uAmt[0]'], state.tune);
    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    const drawRib = (st, mesh) => {
      if (!mesh.count) return;
      gl.useProgram(ribProg.p);
      gl.uniform2f(ribProg.u.uCss, W, H);
      gl.uniform1f(ribProg.u.uTime, t);
      gl.uniform1i(ribProg.u.uMat, st.mat);
      gl.uniform1f(ribProg.u.uSeed, st.seed);
      gl.uniform1f(ribProg.u.uLoad, MATERIALS[st.mat].load * state.phys.brush.load);
      gl.uniform1f(ribProg.u.uDry, state.phys.brush.dry);
      gl.uniform1f(ribProg.u.uBristle, state.phys.brush.bristle);
      gl.uniform1f(ribProg.u.uRelief, state.phys.brush.relief);
      gl.uniform3fv(ribProg.u.uColor, st.color);
      gl.bindVertexArray(mesh.vao);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, mesh.count);
    };
    const drawLayer = (L) => {
      gl.useProgram(layProg.p);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, L.tex);
      gl.uniform1i(layProg.u.uD, 0);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, L.ptex || null);
      gl.uniform1i(layProg.u.uP, 1);
      gl.uniform1i(layProg.u.uFollow, L.ptex ? 1 : 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.uniform2f(layProg.u.uDev, cvs.width, cvs.height);
      gl.uniform2f(layProg.u.uCss, W, H);
      gl.uniform1f(layProg.u.uTime, t);
      gl.uniform1f(layProg.u.uSeed, L.seed);
      gl.uniform1i(layProg.u.uMat, L.mat);
      const G = L.tip === 'round' ? state.phys.round.grain : 1;
      gl.uniform1f(layProg.u.uGrain, Math.min(1, G));
      gl.uniform1f(layProg.u.uTooth, L.tip === 'round' ? G : 0);
      gl.uniform1f(layProg.u.uRelief, (state.phys[L.tip] || state.phys.spray).relief);
      gl.uniform3fv(layProg.u.uColor, L.color);
      gl.bindVertexArray(emptyVao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    for (const it of items) it.kind === 'ribbon' ? drawRib(it, it.mesh) : drawLayer(it);
    if (cur && cur.kind === 'ribbon') drawRib(cur, liveMesh);
    gl.bindVertexArray(null);
    requestAnimationFrame(frame);
  }

  let seeded = false;
  function resize() {
    const r = stage.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cvs.width = DW = Math.round(W * dpr); cvs.height = DH = Math.round(H * dpr);
    ov.width = DW; ov.height = DH;
    drawBackground();
    resizeMasks();
    for (const it of items) if (it.kind === 'layer') { allocLayer(it); rasterLayer(it); }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!seeded) { seeded = true; seed(); }
  }
  new ResizeObserver(resize).observe(stage);
  syncUI();
  resize();
  if (document.fonts) document.fonts.ready.then(drawBackground);
  requestAnimationFrame(frame);
})();
</script>
