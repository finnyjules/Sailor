<meta charset="utf-8">
<title>Layout Pane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&family=Anton&family=Caveat:wght@600&display=swap">
<style>
  /* A mock of Sailor's Frame editor, which is dark: this page commits to that one look. */
  :root {
    color-scheme: dark;
    --bg: #0f0f11; --stage: #0a0a0b; --panel: #1a1a1d; --panel2: #222226; --line: #2f2f35;
    --text: #ececef; --muted: #8e8e98; --faint: #5d5d66; --focus: #ffffff;
    --sans: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); padding: 0 16px; padding-block: 16px; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; height: calc(100% - 0px); }
  @media (max-width: 880px) { .app { grid-template-columns: 1fr; height: auto; } }

  .left { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .trybar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 11.5px; color: var(--muted); }
  .trybar .lbl { font: 400 10.5px/1 var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
  .grp { display: flex; align-items: center; gap: 6px; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button { background: transparent; border: 0; border-radius: 6px; padding: 5px 9px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel2); color: var(--text); }
  .sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; position: relative; padding: 0; }
  .sw[aria-pressed="true"] { outline: 2px solid var(--text); outline-offset: 2px; }
  .sw i { position: absolute; right: 3px; bottom: 3px; width: 7px; height: 7px; border-radius: 2px; }

  .stage { flex: 1; min-height: 440px; background: var(--stage); border: 1px solid var(--line); border-radius: 14px;
           display: grid; place-items: center; padding: 28px; position: relative; overflow: hidden; }
  .stage .poster { width: min(100%, calc((100vh - 150px) * var(--arinv, .7))); }
  .toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--panel2);
           border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--text);
           opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; }

  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px;
          display: flex; flex-direction: column; gap: 10px; overflow: auto; max-height: calc(100vh - 32px); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-radius: 9px; padding: 3px; }
  .tabs span { text-align: center; padding: 6px 0; border-radius: 7px; font-size: 12px; color: var(--faint); }
  .tabs span.on { background: var(--panel2); color: var(--text); }
  .card { background: var(--panel2); border-radius: 11px; padding: 12px; display: grid; gap: 12px; }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card h2 small { font: 400 11px/1 var(--mono); color: var(--muted); }
  .did { font-size: 12px; color: var(--muted); margin: -6px 0 0; line-height: 1.4; }

  .vary { display: grid; grid-template-columns: 34px 1fr 34px; gap: 6px; }
  .vary button { height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  .vary .main { background: #f1f0ec; color: #111; border-color: #f1f0ec; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .vary .main kbd { font: 500 10.5px/1 var(--mono); background: rgb(0 0 0 / .1); border-radius: 4px; padding: 3px 5px; }
  .vary button:disabled { opacity: .4; cursor: default; }
  .hint { font-size: 11px; color: var(--faint); margin: -4px 0 0; }

  .choices { display: grid; gap: 10px; }
  .choice { display: grid; gap: 5px; }
  .choice .lab { font-size: 11px; color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .pill { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 8px; font-size: 11.5px; color: var(--text);
          cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill[aria-pressed="true"] { background: #f1f0ec; color: #111; border-color: #f1f0ec; }
  .pill:disabled { color: var(--faint); cursor: not-allowed; text-decoration: line-through; }

  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .thumb { all: unset; cursor: pointer; border-radius: 4px; display: block; width: 100%; }
  .thumb .poster { box-shadow: none; }
  .thumb[aria-current="true"] { outline: 2px solid #f1f0ec; outline-offset: 2px; }
  .thumb:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sub { font-size: 11px; color: var(--muted); margin: 0; }

  .lib { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
  .lib .tile { all: unset; cursor: pointer; display: grid; gap: 4px; min-width: 0; }
  .lib .tile span { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib .tile[aria-current="true"] .poster { outline: 2px solid #f1f0ec; outline-offset: 2px; }
  .lib .tile[aria-current="true"] span { color: var(--text); }
  .lib .tile:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* poster */
  .poster { container-type: inline-size; position: relative; width: 100%; overflow: hidden; background: var(--field); color: var(--ink); }
  .poster .el { position: absolute; font-family: var(--sans); margin: 0; }
  .poster .t { text-box: trim-both cap alphabetic; font-kerning: normal; }
  @supports not (text-box: trim-both cap alphabetic) { .poster .t { line-height: 0.8 !important; } }
  .poster .photo { background-size: cover; background-position: center; }
  .poster .stand { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--ink) 62%, var(--field)) 0 1.2cqw, color-mix(in srgb, var(--ink) 54%, var(--field)) 1.2cqw 2.4cqw); }
  .poster .rulel { height: 0; border-top: 0.16cqw solid var(--ink); }
  .sel select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 28px 6px 9px; font: 12px var(--sans); }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .fmtnote { margin: 0; font: 400 11px/1.4 var(--mono); color: var(--muted); }
  .keepzone { position: absolute; left: 0; right: 0; pointer-events: none; display: grid; place-items: center;
              background: repeating-linear-gradient(135deg, rgb(0 0 0 / .32) 0 6px, rgb(0 0 0 / .18) 6px 12px);
              color: #fff; font: 500 11px/1 var(--sans); letter-spacing: .02em; }
  .lib .none { grid-column: 1 / -1; font-size: 11px; color: var(--faint); margin: 2px 0 0; }
  .poster .btn { display: flex; align-items: center; justify-content: center; font-family: var(--sans); white-space: nowrap; line-height: 1; }
  .poster .btn.link { justify-content: flex-start; text-decoration: underline; text-underline-offset: .32em; text-decoration-thickness: .07em; }
  .poster .logo { display: flex; align-items: center; gap: .5em; font-family: var(--sans); font-weight: 700; letter-spacing: .14em; white-space: nowrap; line-height: 1; }
  .poster .logo i { width: 1.6em; height: 1.6em; border-radius: 50%; border: .3em solid currentColor; flex: none; box-sizing: border-box; }
  .facenote[hidden] { display: none; }
  .poster .stars { display: flex; align-items: center; gap: .08em; line-height: 1; white-space: nowrap; font-family: var(--sans); }
  .poster .stars span { -webkit-background-clip: text; background-clip: text; color: transparent; }
  .poster .stars b { font-size: .62em; font-weight: 600; margin-left: .5em; color: var(--ink); }
  .facenote { font-size: 12px; color: var(--muted); margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; line-height: 1.35; }
  #probe { position: absolute; left: -10000px; top: 0; width: 320px; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">
  <section class="left" aria-label="Frame">
    <div class="trybar">
      <span class="lbl">Try it with</span>
      <div class="grp"><div class="seg" id="content">
        <button type="button" data-v="gallery">Gallery</button>
        <button type="button" data-v="ad" aria-pressed="true">Product ad</button>
        <button type="button" data-v="event">Event</button>
        <button type="button" data-v="quote">Quote</button>
      </div></div>
      <div class="grp"><label class="sel"><span class="vh">Format</span><select id="format"></select></label></div>
      <div class="grp"><div class="seg" id="photo">
        <button type="button" data-v="0">No image</button>
        <button type="button" data-v="1" aria-pressed="true">Image</button>
      </div></div>
      <div class="grp" id="pal"></div>
    </div>
    <div class="stage" id="stage"><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
    <p class="fmtnote" id="fmtnote"></p>
  </section>

  <aside class="pane" aria-label="Layout pane">
    <div class="tabs" aria-hidden="true"><span>Design</span><span>Motion</span><span class="on">Layout</span></div>

    <div class="card">
      <div class="choice"><span class="lab">Style</span>
        <div class="pills" id="style" role="group" aria-label="Style">
          <button type="button" class="pill" data-v="swiss">Swiss</button>
          <button type="button" class="pill" data-v="performance" aria-pressed="true">Performance</button>
          <button type="button" class="pill" data-v="editorial">Editorial</button>
          <button type="button" class="pill" data-v="street">Street</button>
        </div>
      </div>
      <p class="facenote" id="facenote" hidden></p>
    </div>

    <div class="card">
      <h2><span id="lname">Layout</span><small id="count"></small></h2>
      <p class="did" id="did"></p>
      <div class="vary">
        <button type="button" id="prev" aria-label="Previous variation">‹</button>
        <button type="button" class="main" id="next">Vary <kbd>V</kbd></button>
        <button type="button" id="fwd" aria-label="Next variation">›</button>
      </div>
      <p class="hint">Each change applies to the Frame and is one step to undo. ← → step through.</p>
      <div class="choices" id="choices"></div>
      <div>
        <p class="sub" style="margin-bottom:6px">Best variations</p>
        <div class="strip" id="strip"></div>
      </div>
    </div>

    <div class="card">
      <h2><span>All layouts</span><small id="libcount"></small></h2>
      <div class="lib" id="lib"></div>
    </div>
  </aside>
</div>
<div id="probe" aria-hidden="true"></div>

<script>
(() => {
  // ═══════════════════════ the kit ═══════════════════════
  // The sheet comes from the Frame's shape. Layouts are written on a 12-column,
  // 16-row design grid; X/XR map those columns onto the real column count
  // (12, 16 or 20) and L maps rows proportionally onto the real height.
  // Formats: size, the width people actually see it at (sets the minimum text size),
  // and areas the platform covers with its own interface.
  const SHAPES = {
    poster: { label: 'Poster',          px: '895 × 1280',  ar: 1280 / 895,  nc: 12 },
    post45: { label: 'Post 4:5',        px: '1080 × 1350', ar: 1350 / 1080, nc: 12, view: 390, nativeCTA: true },
    post11: { label: 'Post 1:1',        px: '1080 × 1080', ar: 1,           nc: 12, view: 390, nativeCTA: true },
    story:  { label: 'Story 9:16',      px: '1080 × 1920', ar: 1920 / 1080, nc: 12, view: 390, keep: { top: 0.14, bottom: 0.35, side: 0.06 }, nativeCTA: true },
    thumb:  { label: 'Video thumbnail', px: '1280 × 720',  ar: 720 / 1280,  nc: 16, view: 170, carries: 2, noAction: true },
    link:   { label: 'Link preview',    px: '1200 × 628',  ar: 628 / 1200,  nc: 16, view: 500, noAction: true },
    mpu:    { label: 'Ad 300 × 250',    px: '300 × 250',   ar: 250 / 300,   nc: 12, view: 300 },
    sky:    { label: 'Ad 160 × 600',    px: '160 × 600',   ar: 600 / 160,   nc: 12, view: 160, carries: 3 },
    leader: { label: 'Ad 728 × 90',     px: '728 × 90',    ar: 90 / 728,    nc: 24, view: 728, carries: 3 },
  };
  const W = 100, NR = 16;
  let H, M, G, NC, CW, RH, GAP, B;
  const Xr = c => M + (c - 1) * (CW + G);
  let colA = 1, colB = 12;                             // the real columns the design grid spans
  const cs = c => colA + Math.round((c - 1) * (colB - colA + 1) / 12);   // design column → real start column
  const ce = c => colA - 1 + Math.round(c * (colB - colA + 1) / 12);     // design column → real end column
  const X = c => Xr(cs(c));                            // left edge of design column c
  const XR = c => Xr(ce(c)) + CW;                      // right edge of design column c
  const SPAN = (a, b) => XR(b) - X(a);
  const L = r => M + r * RH;                           // line under design row r; L(0) = top margin
  function setShape(k, composeH) {
    const sh = SHAPES[k];
    const Hfull = 100 * sh.ar;
    H = composeH ?? Hfull; NC = sh.nc; colA = 1; colB = NC;
    B = Math.sqrt(W * Hfull) / Math.sqrt(100 * 100 * 1280 / 895); // size unit: 1 on the portrait poster
    M = Math.min(4, H * 0.06);
    if (composeH && sh.keep?.side) M = Math.max(M, sh.keep.side * 100);    // the platform's side margins
    G = 1.6 * B;
    CW = (W - 2 * M - (NC - 1) * G) / NC;
    RH = (H - 2 * M) / NR;
    GAP = RH * 0.5;
    const floor = sh.view ? 100 * 9 / sh.view : 0;         // at least 9px at the size people see it
    INFO.size = Math.max(1.95 * B, floor); SECOND.size = Math.max(4.4 * B, INFO.size * 1.6);
  }
  const CAP = 0.705;                              // Geist cap height per em

  const DISPLAY = { wt: 600, ls: -0.05, lh: 0.9 };
  const SECOND  = { size: 4.4, wt: 500, ls: -0.02, lh: 1.04 };
  const INFO    = { size: 1.95, wt: 400, ls: 0, lh: 1.3 };

  // measurement: width at 100px, with the letter spacing the layout will set
  const meas = document.createElement('span');
  meas.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre;font-size:100px;font-family:' + getComputedStyle(document.body).getPropertyValue('--sans');
  document.body.appendChild(meas);
  const cache = new Map();
  // Measure with canvas text metrics: they work even when the page is not laid out yet
  // (an embedded viewer can load it hidden, where every box measures zero).
  const mctx = document.createElement('canvas').getContext('2d');
  const measure100 = (s, st) => {
    mctx.font = `${st.wt} 100px ${st.font || getComputedStyle(document.body).getPropertyValue('--sans')}`;
    return mctx.measureText(s).width + (st.ls || 0) * 100 * Math.max(0, [...s].length - 1);
  };
  const SANS_STACK = getComputedStyle(document.body).getPropertyValue('--sans');
  function w100(s, st) {
    const k = s + '|' + st.wt + '|' + st.ls + '|' + (st.font || '');
    if (cache.has(k)) return cache.get(k);
    meas.style.fontFamily = st.font || SANS_STACK; meas.style.fontWeight = st.wt; meas.style.letterSpacing = (st.ls || 0) + 'em'; meas.textContent = s;
    const v = measure100(s, st);
    if (v > 0) cache.set(k, v);                    // never remember a zero
    return v;
  }
  let SCALE = 1, FLIP = false;                        // set per variation by the pane
  const fitSize = (lines, width, st = DISPLAY) => SCALE * Math.min(...lines.map(l => width * 100 / Math.max(1, w100(l, st))));
  const blockH = (n, size, lh) => ((n - 1) * lh + CAP) * size;
  const sizeFor = (lines, width, maxH, st = DISPLAY) => Math.min(fitSize(lines, width, st), SCALE * maxH / ((lines.length - 1) * st.lh + CAP));
  function breakLines(words, width, size, st) {
    const out = []; let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (cur && w100(t, st) * size / 100 > width) { out.push(cur); cur = w } else cur = t;
    }
    if (cur) out.push(cur); return out;
  }
  const countLines = (s, width, st, size) => s.split('\n').reduce((a, p) => a + breakLines(p.split(' '), width, size, st).length, 0);
  function balance(words, n) {
    const total = words.join(' ').length, target = total / n, out = []; let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (cur && out.length < n - 1 && t.length > target * 1.08) { out.push(cur); cur = w } else cur = t;
    }
    out.push(cur); return out;
  }

  // element builders
  const text = (s, o) => ({ k: 't', s, ...o });
  const disp = (s, o) => text(s, { wt: DISPLAY.wt, ls: DISPLAY.ls, lh: DISPLAY.lh, font: DISPLAY.font, role: 'title', pre: true, ...o });
  const sec  = (s, o) => text(s, { size: SECOND.size, wt: SECOND.wt, ls: SECOND.ls, lh: SECOND.lh, role: 'details', ...o });
  const info = (s, o) => text(s, { size: INFO.size, wt: INFO.wt, ls: INFO.ls || 0, lh: INFO.lh, role: 'info', ...o });
  const rule = (x, y, w) => ({ k: 'l', x, y, w });
  // Quote the Frame's own words instead of naming what they might be ("the dates", "the artist").
  const q = (s, fallback = 'the smaller text') => { if (!s) return fallback; const l = s.split('\n')[0]; return `“${l.length > 20 ? l.slice(0, 19) + '…' : l}”` };

  // information stacked in a column, top-anchored; returns the bottom
  function infoStack(items, c1, c2, top) {
    const els = []; let y = top; const w = SPAN(c1, c2);
    items.forEach((it, i) => {
      const n = countLines(it.s, w, INFO, INFO.size);
      els.push(info(it.s, { x: X(c1), w, top: y, wt: it.wt || INFO.wt, role: it.role || 'info' }));
      y += blockH(n, INFO.size, INFO.lh) + (i < items.length - 1 ? INFO.size * 1.25 : 0);
    });
    return { els, bottom: y };
  }
  // a row of information blocks sharing one baseline or one cap line
  function infoRow(c, spec, where) {
    const els = []; let extent = 0;
    for (const [key, a, b] of spec) {
      const s = c[key]; if (!s) continue;
      const n = countLines(s, SPAN(a, b), INFO, INFO.size);
      extent = Math.max(extent, blockH(n, INFO.size, INFO.lh));
      const o = { x: X(a), w: SPAN(a, b), wt: key === 'details' ? 500 : INFO.wt, role: key };
      if (where === 'foot') o.base = L(16); else o.top = M;
      els.push(info(s, o));
    }
    return { els, top: where === 'foot' ? L(16) - extent : M, bottom: where === 'foot' ? L(16) : M + extent };
  }
  const FOOT3 = [['details', 1, 4], ['date', 5, 8], ['caption', 9, 12]];
  const FOOT2 = [['date', 1, 4], ['caption', 5, 12]];

  // the photo: whole columns, 4:5, the largest that fits the zone
  const PHOTO_ASPECT = 1.25;
  function photoIn(z, { ax = 'right', ay = 'top' } = {}) {
    if (FLIP) ax = ax === 'right' ? 'left' : 'right';
    const avail = z.bottom - z.top;
    for (let n = z.c2 - z.c1 + 1; n >= 2; n--) {
      const w = SPAN(1, n), h = w * PHOTO_ASPECT;
      if (h <= avail) {
        const c1 = ax === 'right' ? z.c2 - n + 1 : z.c1;
        return { k: 'p', x: X(c1), y: ay === 'top' ? z.top : z.bottom - h, w, h, role: 'photo' };
      }
    }
    return { k: 'missing' };
  }

  function rngFor(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 };
  }
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];

  // ═══════════════════════ the 27 layouts ═══════════════════════
  const P = [];
  const def = (id, name, fits, needs, fn) => P.push({ id, name, fits, needs, fn });
  const ALL = ['word', 'phrase', 'sentence'];

  def('runoff', 'Run-off', ALL, null, ({ c, ph, kind, lines, arr = 0 }) => {
    const base = arr === 2 ? L(12) : L(10);                 // A: right edge · B: left edge · C: lower baseline
    const ls = kind === 'word' ? [c.title] : lines;
    const hh = (ls.length - 1) * DISPLAY.lh + CAP;
    let size = fitSize(ls, (XR(12) + M) * 1.1 - M);
    size = Math.min(size, (base - (ph ? L(5) : L(1))) / hh);
    const capTop = base - hh * size;
    const wpx = Math.max(...ls.map(l => w100(l, DISPLAY))) * size / 100;
    const els = [disp(ls.join('\n'), arr === 1
      ? { size, x: XR(12) - wpx + 0.03 * size, w: wpx, align: 'right', base, bleed: true }
      : { size, x: M - 0.04 * size, base, bleed: true })];
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 9), top: base + GAP }));
    els.push(...infoRow(c, FOOT2, 'foot').els);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: M, bottom: capTop - GAP }));
    return { els, did: `Title fitted to run off the ${arr === 1 ? 'left' : 'right'} edge, baseline on row ${arr === 2 ? 12 : 10}.` };
  });

  def('statement', 'Statement', ALL, null, ({ c, ph, r, lines }) => {
    const top = r() < 0.5;
    const maxH = (ph ? L(8) : L(12)) - M;
    const size = sizeFor(lines, SPAN(1, 12), maxH);
    const h = blockH(lines.length, size, DISPLAY.lh);
    const els = [];
    if (top) {
      els.push(disp(lines.join('\n'), { size, x: X(1), top: M }));
      const f = infoRow(c, FOOT3, 'foot'); els.push(...f.els);
      if (ph) els.push(photoIn({ c1: 1, c2: 12, top: M + h + GAP, bottom: f.top - GAP }, { ay: 'bottom' }));
    } else {
      els.push(disp(lines.join('\n'), { size, x: X(1), base: L(16) }));
      const hd = infoRow(c, FOOT3, 'head'); els.push(...hd.els);
      if (ph) els.push(photoIn({ c1: 1, c2: 12, top: hd.bottom + GAP, bottom: L(16) - h - GAP }));
    }
    return { els, did: `One word per line, fitted to the margins, ${top ? 'from the top' : 'on the foot'}.` };
  });

  def('index', 'Index', ALL, null, ({ c, ph, lines }) => {
    const size = sizeFor(lines, SPAN(1, 8), RH * 5);
    const tb = M + blockH(lines.length, size, DISPLAY.lh);
    const els = [disp(lines.join('\n'), { size, x: X(1), top: M })];
    let y = M;
    for (const [key, wt] of [['details', 500], ['caption', 400]]) {
      els.push(rule(X(9), y, SPAN(9, 12)));
      const n = countLines(c[key], SPAN(9, 12), INFO, INFO.size);
      els.push(info(c[key], { x: X(9), w: SPAN(9, 12), top: y + INFO.size * 0.9, wt, role: key }));
      y += INFO.size * 0.9 + blockH(n, INFO.size, INFO.lh) + INFO.size * 1.4;
    }
    els.push(rule(X(9), y, SPAN(9, 12)));
    const dSize = Math.min(fitSize([c.date], SPAN(1, 12)), RH * 2.4 / CAP);
    els.push(disp(c.date, { size: dSize, x: X(1), base: L(16), color: 'accent', role: 'date' }));
    if (ph) els.push(photoIn({ c1: 1, c2: 8, top: tb + GAP * 1.5, bottom: L(16) - CAP * dSize - GAP }, { ax: 'left' }));
    return { els, did: `Title top-left, a ruled table on the right, ${q(c.date)} large at the foot in accent.` };
  });

  def('shapeCounter', 'Shape counter-form', ALL, { shape: true }, ({ c, ph, kind, lines }) => {
    const rad = Math.min(SPAN(4, 12), L(10) - M) / 2, cx = XR(12) - rad, cy = M + rad;
    const els = [{ k: 'c', cx, cy, r: rad, photo: ph, color: 'accent', role: 'shape', ok: true }];
    const ls = kind === 'sentence' ? lines : [c.title];
    const hh = (ls.length - 1) * DISPLAY.lh + CAP;
    const size = Math.min(fitSize(ls, SPAN(1, 12)), RH * (ls.length > 1 ? 6 : 3.4) / hh, (L(14) - cy) / hh);
    const base = cy + rad * 0.45 + (ls.length - 1) * DISPLAY.lh * size;
    els.push(disp(ls.join('\n'), { size, x: X(1), base, ok: true, blend: !ph }));
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 8), top: Math.max(base, cy + rad) + GAP }));
    els.push(...infoRow(c, FOOT2, 'foot').els);
    return { els, did: `A circle in ${ph ? 'the photo' : 'accent'}; the title overprints it.` };
  });

  def('photoBehind', 'Photo behind', ALL, { image: true }, ({ c, ph, lines }) => {
    const top = L(1.5), h = Math.min(SPAN(3, 12) * PHOTO_ASPECT, L(12) - top), w = h / PHOTO_ASPECT;
    const els = [{ k: 'p', x: XR(12) - w, y: top, w, h, stand: !ph, role: 'photo', ok: true }];
    const ls = lines.length > 2 ? lines : [c.title];
    const size = Math.min(fitSize(ls, SPAN(1, 12)), RH * 3.2 / CAP);
    const base = top + CAP * size * 0.5 + (ls.length - 1) * DISPLAY.lh * size;
    els.push(disp(ls.join('\n'), { size, x: X(1), base, ok: true }));
    els.push(sec(c.details, { x: XR(12) - w, w, top: top + h + GAP }));
    els.push(...infoRow(c, FOOT2, 'foot').els);
    return { els, did: 'The photo sits under the title; the title crosses its top edge on purpose.' };
  });

  def('fullBleed', 'Full bleed', ALL, { image: true }, ({ c, ph, lines }) => {
    const w = Math.max(W, H / PHOTO_ASPECT), h = w * PHOTO_ASPECT;
    const els = [{ k: 'p', x: (W - w) / 2, y: (H - h) / 2, w, h, stand: !ph, role: 'photo', ok: true, bleed: true }];
    const size = sizeFor(lines, SPAN(1, 12), RH * 5);
    els.push(disp(lines.join('\n'), { size, x: X(1), base: L(16), color: 'field' }));
    const hd = infoRow(c, FOOT3, 'head');
    hd.els.forEach(e => e.color = 'field'); els.push(...hd.els);
    return { els, did: 'The photo covers the page; title and information overprint it in the field colour.' };
  });

  def('tilt', 'Tilt', ALL, null, ({ c, ph, kind, lines }) => {
    const len = L(16) - M;
    const ls = kind === 'sentence' ? lines : [c.title];
    const hh = (ls.length - 1) * DISPLAY.lh + CAP;
    const size = Math.min(fitSize(ls, len), SPAN(1, 7) / hh);
    const cap = hh * size;
    const k = Math.max(...ls.map(l => w100(l, DISPLAY))) / 100 * size;
    const els = [disp(ls.join('\n'), { size, x: M, top: L(16), rot: -90, origin: 'top left', w: k })];
    let sc = 1; while (sc < 12 && X(sc) < M + cap + G) sc++;
    sc = Math.min(sc, 9);
    els.push(sec(c.details, { x: X(sc), w: SPAN(sc, 12), top: M }));
    const dn = countLines(c.details, SPAN(sc, 12), SECOND, SECOND.size);
    const dBottom = M + blockH(dn, SECOND.size, SECOND.lh);
    const st = infoStack([{ s: c.date, role: 'date' }, { s: c.caption, role: 'caption' }], sc, 12, 0);
    const stH = st.bottom;
    st.els.forEach(e => { e.top += L(16) - stH });
    els.push(...st.els);
    if (ph) els.push(photoIn({ c1: sc, c2: 12, top: dBottom + GAP, bottom: L(16) - stH - GAP }));
    return { els, did: 'Title turned to run up the left edge; everything else hangs from the next free column.' };
  });

  def('bottomHeavy', 'Bottom-heavy', ALL, null, ({ c, ph, lines }) => {
    const maxH = L(16) - (ph ? L(9) : L(5));
    const size = sizeFor(lines, SPAN(1, 12), maxH);
    const capTop = L(16) - blockH(lines.length, size, DISPLAY.lh);
    const els = [disp(lines.join('\n'), { size, x: X(1), base: L(16) })];
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 8), top: M }));
    const dn = countLines(c.details, SPAN(1, 8), SECOND, SECOND.size);
    const st = infoStack([{ s: c.date, role: 'date' }, { s: c.caption, role: 'caption' }], 9, 12, M);
    els.push(...st.els);
    const headBottom = Math.max(M + blockH(dn, SECOND.size, SECOND.lh), st.bottom);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: headBottom + GAP, bottom: capTop - GAP }, { ax: 'left' }));
    return { els, did: 'Title owns the lower half; the small texts wait at the top.' };
  });

  def('fourCorners', 'Four corners', ALL, null, ({ c, ph, lines }) => {
    const maxH = ph ? L(12) - L(8) : L(12) - L(3);
    const size = sizeFor(lines, SPAN(1, 10), maxH);
    const base = L(12);
    const capTop = base - blockH(lines.length, size, DISPLAY.lh);
    const els = [disp(lines.join('\n'), { size, x: X(1), base })];
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 6), top: M }));
    const dn = countLines(c.details, SPAN(1, 6), SECOND, SECOND.size);
    els.push(info(c.date, { x: X(9), w: SPAN(9, 12), top: M, role: 'date' }));
    els.push(info(c.caption, { x: X(1), w: SPAN(1, 6), base: L(16), role: 'caption' }));
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: M + blockH(dn, SECOND.size, SECOND.lh) + GAP, bottom: capTop - GAP }));
    return { els, did: 'Title flush-left mid-page; the small texts pinned to three corners of the grid.' };
  });

  def('spacedLines', 'Spaced lines', ['phrase', 'sentence'], null, ({ c, ph, words }) => {
    const n = words.length;
    const total = L(16) - M;
    const size = Math.min(fitSize(words, SPAN(1, 9)), total / (n * CAP * 1.35));
    const cap = CAP * size;
    const els = [];
    words.forEach((w, i) => {
      const base = n === 1 ? L(16) : M + cap + i * (total - cap) / (n - 1);
      els.push(disp(w, { size, x: X(1), base, role: i ? 'title' + i : 'title' }));
    });
    const st = infoStack([{ s: c.details, wt: 500, role: 'details' }, { s: c.date, role: 'date' }, { s: c.caption, role: 'caption' }], 10, 12, M);
    els.push(...st.els);
    if (ph) els.push(photoIn({ c1: 10, c2: 12, top: st.bottom + GAP * 2, bottom: L(16) }, { ay: 'bottom' }));
    return { els, did: 'Each word on its own line, the lines spread from the top margin to the foot.' };
  });

  def('ragged', 'Ragged', ['phrase', 'sentence'], null, ({ c, ph, r, words }) => {
    const starts = words.map((_, i) => i === 0 ? 1 : pick(r, [1, 3, 4, 5, 7]));
    const maxH = ph ? L(13) - L(7) : L(13) - M;
    let size = Math.min(...words.map((w, i) => SPAN(starts[i], 12) * 100 / w100(w, DISPLAY)));
    size = Math.min(size, maxH / ((words.length - 1) * DISPLAY.lh + CAP));
    const lastBase = L(13);
    const firstBase = lastBase - (words.length - 1) * DISPLAY.lh * size;
    const els = words.map((w, i) => disp(w, { size, x: X(starts[i]), base: firstBase + i * DISPLAY.lh * size, role: i ? 'title' + i : 'title' }));
    const f = infoRow(c, FOOT3, 'foot'); els.push(...f.els);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: M, bottom: firstBase - CAP * size - GAP }));
    return { els, did: `Lines start on different columns (${starts.join(', ')}), set on one baseline rhythm.` };
  });

  def('edges', 'Edges', ['phrase', 'sentence'], null, ({ c, ph, words }) => {
    const n = words.length;
    const f = infoRow(c, FOOT3, 'foot');
    const top = ph ? L(8) : M, bottom = f.top - GAP * 1.5;
    const size = Math.min(fitSize(words, SPAN(1, 9)), (bottom - top) / (n * CAP * 1.3));
    const cap = CAP * size;
    const els = words.map((w, i) => {
      const base = n === 1 ? bottom : top + cap + i * (bottom - top - cap) / (n - 1);
      return disp(w, { size, x: X(1), w: SPAN(1, 12), align: i % 2 ? 'right' : 'left', base, role: i ? 'title' + i : 'title' });
    });
    els.push(...f.els);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: M, bottom: top - GAP }, { ax: 'right' }));
    return { els, did: 'Words pushed to alternate margins and spread from top to foot.' };
  });

  def('staircase', 'Staircase', ['phrase', 'sentence'], null, ({ c, ph, words }) => {
    const n = words.length;
    const step = n > 1 ? Math.max(1, Math.min(4, Math.floor(8 / (n - 1)))) : 0;
    const starts = words.map((_, i) => 1 + i * step);
    const maxH = (ph ? L(11) : L(14)) - M;
    let size = Math.min(...words.map((w, i) => SPAN(starts[i], 12) * 100 / w100(w, DISPLAY)));
    size = Math.min(size, maxH / ((n - 1) * DISPLAY.lh + CAP));
    const bases = words.map((_, i) => M + CAP * size + i * DISPLAY.lh * size);
    const els = words.map((w, i) => disp(w, { size, x: X(starts[i]), base: bases[i], role: i ? 'title' + i : 'title' }));
    const f = infoRow(c, FOOT3, 'foot'); els.push(...f.els);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: bases[n - 1] + GAP, bottom: f.top - GAP }, { ax: 'left', ay: 'bottom' }));
    return { els, did: `Each word steps ${step} column${step > 1 ? 's' : ''} to the right.` };
  });

  def('block', 'Block', ['phrase', 'sentence'], null, ({ c, ph, words }) => {
    const target = (ph ? L(8) : L(12)) - M;
    let size = fitSize([words.reduce((a, b) => w100(a, DISPLAY) > w100(b, DISPLAY) ? a : b)], SPAN(1, 12));
    let lines;
    for (; size > 2; size *= 0.97) {
      lines = breakLines(words, SPAN(1, 12), size, DISPLAY);
      if (blockH(lines.length, size, DISPLAY.lh) <= target) break;
    }
    const els = lines.map((l, i) => disp(l, { size, x: X(1), w: SPAN(1, 12), base: M + CAP * size + i * DISPLAY.lh * size, just: lines.length > 1 && l.includes(' '), role: i ? 'title' + i : 'title' }));
    const bottom = M + blockH(lines.length, size, DISPLAY.lh);
    const f = infoRow(c, FOOT3, 'foot'); els.push(...f.els);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: bottom + GAP * 1.5, bottom: f.top - GAP }, { ay: 'bottom' }));
    return { els, did: 'The title set as one justified block across all 12 columns.' };
  });

  def('knockout', 'Knockout', ALL, { shape: true }, ({ c, ph, lines }) => {
    const bandTop = ph ? L(9) : L(5), bandBot = ph ? L(14) : L(11);
    const pad = RH * 0.6;
    const ls = lines.length > 2 ? lines : [c.title];
    const size = sizeFor(ls, SPAN(1, 12), bandBot - bandTop - 2 * pad);
    const els = [{ k: 'r', x: 0, y: bandTop, w: XR(12) + M, h: bandBot - bandTop, color: 'ink', role: 'shape', ok: true, bleed: true }];
    els.push(disp(ls.join('\n'), { size, x: X(1), base: bandBot - pad, color: 'field', ok: true }));
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 8), top: M }));
    const dn = countLines(c.details, SPAN(1, 8), SECOND, SECOND.size);
    els.push(info(c.date, { x: X(9), w: SPAN(9, 12), top: M, role: 'date' }));
    els.push(info(c.caption, { x: X(1), w: SPAN(1, 6), base: L(16), role: 'caption' }));
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: M + blockH(dn, SECOND.size, SECOND.lh) + GAP, bottom: bandTop - GAP }));
    return { els, did: 'A full-width band in the ink colour; the title reversed out of it.' };
  });

  def('shapeBleed', 'Bleed', ALL, { shape: true }, ({ c, ph, lines }) => {
    const cy = L(4), rad = Math.min(W * 0.5, L(9) - cy), cx = W - rad * 0.4;
    const els = [{ k: 'c', cx, cy, r: rad, photo: ph, color: 'accent', role: 'shape', bleed: true }];
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 3), top: M }));
    const base = L(14);
    const size = sizeFor(lines, SPAN(1, 12), base - (cy + rad) - GAP * 1.5);
    els.push(disp(lines.join('\n'), { size, x: X(1), base }));
    els.push(...infoRow(c, FOOT2, 'foot').els);
    return { els, did: `A circle ${ph ? 'of photo ' : ''}bleeds off the top and right; the title takes the lower third.` };
  });

  def('badge', 'Badge', ALL, { shape: true }, ({ c, ph, lines }) => {
    const rad = Math.min(SPAN(9, 12), L(5) - M) / 2, cx = XR(12) - rad, cy = M + rad;
    const els = [{ k: 'c', cx, cy, r: rad, color: 'ink', role: 'shape', ok: true }];
    const dn = countLines(c.date, rad * 1.4, INFO, INFO.size);
    const dh = blockH(dn, INFO.size, INFO.lh);
    els.push(info(c.date, { x: cx - rad * 0.7, w: rad * 1.4, top: cy - dh / 2, align: 'center', color: 'field', role: 'date', ok: true, wt: 500, inside: 'shape' }));
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 7), top: M }));
    const detB = M + blockH(countLines(c.details, SPAN(1, 7), SECOND, SECOND.size), SECOND.size, SECOND.lh);
    const base = L(14);
    const size = sizeFor(lines, SPAN(1, 12), base - (ph ? L(9) : cy + rad + GAP));
    els.push(disp(lines.join('\n'), { size, x: X(1), base }));
    els.push(info(c.caption, { x: X(1), w: SPAN(1, 6), base: L(16), role: 'caption' }));
    const capTop = base - blockH(lines.length, size, DISPLAY.lh);
    if (ph) els.push(photoIn({ c1: 1, c2: 8, top: detB + GAP, bottom: capTop - GAP }, { ax: 'left' }));
    return { els, did: `${q(c.date)} in a small round badge, top right; the title large below.` };
  });

  def('split', 'Split', ALL, { image: true }, ({ c, ph, lines }) => {
    const w = W, h = W * PHOTO_ASPECT, bottom = L(8);
    const els = [{ k: 'p', x: 0, y: bottom - h, w, h, stand: !ph, role: 'photo', bleed: true }];
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 8), top: bottom + GAP }));
    const dB = bottom + GAP + blockH(countLines(c.details, SPAN(1, 8), SECOND, SECOND.size), SECOND.size, SECOND.lh);
    const f = infoRow(c, FOOT2, 'foot'); els.push(...f.els);
    const base = f.top - GAP * 1.5;
    const size = sizeFor(lines, SPAN(1, 12), base - dB - GAP);
    els.push(disp(lines.join('\n'), { size, x: X(1), base }));
    return { els, did: 'The photo takes the upper half, cropped by the page edge; type the lower.' };
  });

  def('diagonal', 'Diagonal', ALL, null, ({ c, ph, r, lines }) => {
    const deg = pick(r, [-18, -26, -36]), a = Math.abs(deg) * Math.PI / 180;
    const hd = [sec(c.details, { x: X(1), w: SPAN(1, 8), top: M })];
    hd.push(info(c.date, { x: X(9), w: SPAN(9, 12), top: M, role: 'date' }));
    const headB = M + blockH(countLines(c.details, SPAN(1, 8), SECOND, SECOND.size), SECOND.size, SECOND.lh);
    const foot = info(c.caption, { x: X(1), w: SPAN(1, 6), base: L(16), role: 'caption' });
    const footTop = L(16) - blockH(countLines(c.caption, SPAN(1, 6), INFO, INFO.size), INFO.size, INFO.lh);
    const els = [...hd, foot];
    let zTop = headB + GAP;
    if (ph) {
      const p = photoIn({ c1: 1, c2: 12, top: headB + GAP, bottom: headB + GAP + (footTop - headB) * 0.42 }, { ax: 'left' });
      els.push(p); if (p.k === 'p') zTop = p.y + p.h + GAP;
    }
    const zH = footTop - GAP - zTop;
    const k = Math.max(...lines.map(l => w100(l, DISPLAY))) / 100;
    const hh = (lines.length - 1) * DISPLAY.lh + CAP;
    const size = Math.min(SPAN(1, 12) / (k * Math.cos(a) + hh * Math.sin(a)), zH / (k * Math.sin(a) + hh * Math.cos(a)));
    const len = k * size, bh = hh * size;
    const cx = (X(1) + XR(12)) / 2, cy = zTop + zH / 2;
    els.push(disp(lines.join('\n'), { size, x: cx - len / 2, top: cy - bh / 2, w: len, rot: deg, origin: 'center' }));
    return { els, did: `Title rotated ${Math.abs(deg)}° as one block, kept inside the free band.` };
  });

  def('wall', 'Wall', ['phrase', 'sentence'], null, ({ c, ph, words, kind }) => {
    const lines = kind === 'phrase' ? words : balance(words, 4);
    const f = infoRow(c, FOOT3, 'foot');
    const avail = (ph ? L(9) : f.top - GAP) - M;
    const gapL = RH * 0.28;
    let sizes = lines.map(l => fitSize([l], SPAN(1, 12)));
    const capSum = sizes.reduce((a, s) => a + CAP * s, 0);
    const need = capSum + gapL * (lines.length - 1);
    if (need > avail) { const fct = (avail - gapL * (lines.length - 1)) / capSum; sizes = sizes.map(s => s * fct) }
    const els = []; let y = M;
    lines.forEach((l, i) => { els.push(disp(l, { size: sizes[i], x: X(1), top: y, role: i ? 'title' + i : 'title' })); y += CAP * sizes[i] + gapL });
    els.push(...f.els);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: y - gapL + GAP, bottom: f.top - GAP }, { ay: 'bottom' }));
    return { els, did: 'Every line fitted to the full width at its own size, stacked into a wall.' };
  });

  def('scatter', 'Scatter', ['word', 'phrase'], null, ({ c, ph, r }) => {
    const letters = [...c.title.replace(/\s+/g, '')];
    const cells = [];
    for (let j = 0; j < 7; j++) for (let i = 0; i < 4; i++) {
      if (ph && i >= 2 && j < 4) continue;
      cells.push({ i, j });
    }
    const chosen = cells.map(cc => ({ cc, v: r() })).sort((a, b) => a.v - b.v).slice(0, Math.min(letters.length, cells.length))
      .map(o => o.cc).sort((a, b) => a.j - b.j || a.i - b.i);
    const size = Math.min(fitSize(['W'], SPAN(1, 3) * 0.95), 2 * RH * 0.82 / CAP);
    const els = chosen.map((cc, n) => disp(letters[n], { size, x: X(cc.i * 3 + 1), top: L(cc.j * 2), role: 'title' + n }));
    els.push(...infoRow(c, FOOT3, 'foot').els);
    if (ph) els.push(photoIn({ c1: 7, c2: 12, top: M, bottom: L(8) - GAP }));
    return { els, did: 'Letters dealt into a 4 × 7 module grid, still in reading order.' };
  });

  def('cascade', 'Cascade', ['word'], null, ({ c, ph }) => {
    const letters = [...c.title];
    const n = letters.length;
    const step = n > 1 ? Math.max(1, Math.min(3, Math.floor(10 / (n - 1)))) : 0;
    const starts = letters.map((_, i) => Math.min(12, 1 + i * step));
    const avail = (ph ? L(10) : L(15) - GAP) - M;
    const size = Math.min(avail / ((n - 1) * DISPLAY.lh + CAP), fitSize(['W'], SPAN(starts[n - 1], 12)));
    const bases = letters.map((_, i) => M + CAP * size + i * DISPLAY.lh * size);
    const els = letters.map((l, i) => disp(l, { size, x: X(starts[i]), base: bases[i], role: 'title' + i }));
    const f = infoRow(c, FOOT3, 'foot'); els.push(...f.els);
    if (ph) els.push(photoIn({ c1: 1, c2: Math.max(2, starts[n - 1] - 1), top: bases[Math.max(0, n - 2)] + GAP, bottom: f.top - GAP }, { ax: 'left', ay: 'bottom' }));
    return { els, did: `One letter per line, each ${step} column${step > 1 ? 's' : ''} further right.` };
  });

  def('ring', 'Ring', ['word'], null, ({ c, ph }) => {
    const unit = c.title + ' — ';
    const outer = Math.min(SPAN(1, 12), L(12) - M) / 2;
    let size = 10;
    for (let i = 0; i < 4; i++) { const R = outer - CAP * size; size = Math.min(2 * Math.PI * R / (3 * w100(unit, DISPLAY) / 100), R * 0.4 / CAP) }
    const R = outer - CAP * size, cx = W / 2, cy = M + outer;
    const els = [{ k: 'ring', cx, cy, R, size, s: unit.repeat(3), role: 'title' }];
    if (ph) els.push({ k: 'c', cx, cy, r: R - GAP, photo: true, role: 'photo', ok: true });
    else els.push(sec(c.details, { x: cx - R * 0.7, w: R * 1.4, top: cy - SECOND.size * CAP / 2, align: 'center', ok: true }));
    const below = cy + outer + GAP;
    if (ph) els.push(sec(c.details, { x: X(1), w: SPAN(1, 8), top: below }));
    els.push(...infoRow(c, FOOT2, 'foot').els);
    return { els, did: 'The word repeated three times around a ring that fills the width.' };
  });

  def('cells', 'Cells', ['word', 'phrase'], null, ({ c, ph }) => {
    const letters = [...c.title.replace(/\s+/g, '')];
    const n = letters.length;
    const f = infoRow(c, FOOT3, 'foot');
    const avail = (ph ? L(9) : f.top - GAP) - M;
    let best = null;
    for (const p of [2, 3, 4, 6]) {
      const cellW = SPAN(1, 12 / p), rows = Math.ceil(n / p);
      const cellH = Math.min(cellW * 1.15, avail / rows);
      const size = Math.min(fitSize(['W'], cellW * 0.8), (cellH - RH * 0.5) / CAP);
      if (!best || size > best.size) best = { p, cellW, cellH, rows, size };
    }
    const { p, cellH, size } = best;
    const els = [];
    letters.forEach((l, k) => {
      const i = k % p, j = Math.floor(k / p);
      const y = M + j * cellH;
      if (i === 0) els.push(rule(X(1), y, SPAN(1, 12)));
      els.push(disp(l, { size, x: X(i * (12 / p) + 1), top: y + RH * 0.35, role: 'title' + k }));
    });
    const gridB = M + best.rows * cellH;
    els.push(rule(X(1), gridB, SPAN(1, 12)));
    els.push(...f.els);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: gridB + GAP, bottom: f.top - GAP }, { ay: 'bottom' }));
    return { els, did: `Letters in ruled cells, ${p} to a row.` };
  });

  def('kicker', 'Kicker', ['phrase'], null, ({ c, ph }) => {
    const base = ph ? L(13) : L(9);
    const size = Math.min(fitSize([c.title], SPAN(1, 12)), RH * 3 / CAP);
    const capTop = base - CAP * size;
    const eyeBase = capTop - RH * 0.6;
    const els = [disp(c.title, { size, x: X(1), base })];
    els.push(info(c.details, { x: X(1), w: SPAN(1, 8), base: eyeBase, wt: 500, role: 'details' }));
    els.push(...infoRow(c, FOOT2, 'foot').els);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: M, bottom: eyeBase - INFO.size * CAP - GAP }));
    return { els, did: 'A small eyebrow tight above a one-line title, both flush-left.' };
  });

  def('sidebar', 'Sidebar', ['phrase', 'sentence'], null, ({ c, ph, lines }) => {
    const maxH = (ph ? L(8) : L(16)) - M;
    const size = sizeFor(lines, SPAN(1, 8), maxH);
    const els = [disp(lines.join('\n'), { size, x: X(1), top: M })];
    const st = infoStack([{ s: c.details, wt: 500, role: 'details' }, { s: c.date, role: 'date' }, { s: c.caption, role: 'caption' }], 10, 12, M);
    els.push(...st.els);
    const tb = M + blockH(lines.length, size, DISPLAY.lh);
    if (ph) els.push(photoIn({ c1: 1, c2: 8, top: tb + GAP, bottom: L(16) }, { ax: 'left', ay: 'bottom' }));
    return { els, did: 'Title in eight columns; information in the last three, from the same cap line.' };
  });

  def('footer', 'Footer', ALL, null, ({ c, ph, lines }) => {
    const maxH = (ph ? L(7) : L(14)) - M;
    const size = sizeFor(lines, SPAN(1, 12), maxH);
    const els = [disp(lines.join('\n'), { size, x: X(1), top: M })];
    const f = infoRow(c, FOOT3, 'foot'); els.push(...f.els);
    const tb = M + blockH(lines.length, size, DISPLAY.lh);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: tb + GAP, bottom: f.top - GAP }, { ay: 'bottom' }));
    return { els, did: 'Title from the top margin; the smaller text in three columns on the foot line.' };
  });

  // ─────────── new photo-led layouts ───────────
  const defNew = (id, name, fn) => { def(id, name, ALL, { image: true }, fn); P[P.length - 1].isNew = true };
  const cover = ph => { const w = Math.max(W, H / PHOTO_ASPECT), h = w * PHOTO_ASPECT; return { k: 'p', x: (W - w) / 2, y: (H - h) / 2, w, h, stand: !ph, role: 'photo', ok: true, bleed: true } };
  function infoRowAt(c, spec, base) {
    const els = []; let extent = 0;
    for (const [key, a, b] of spec) {
      const s = c[key]; if (!s) continue;
      extent = Math.max(extent, blockH(countLines(s, SPAN(a, b), INFO, INFO.size), INFO.size, INFO.lh));
      els.push(info(s, { x: X(a), w: SPAN(a, b), base, wt: key === 'details' ? 500 : INFO.wt, role: key }));
    }
    return { els, top: base - extent };
  }
  function stackBottom(items, c1, c2, bottom) {
    const st = infoStack(items, c1, c2, 0);
    st.els.forEach(e => { e.top += bottom - st.bottom });
    return { els: st.els, top: bottom - st.bottom };
  }

  defNew('plate', 'Plate', ({ c, ph, lines }) => {
    const h = Math.min(SPAN(1, 9) * PHOTO_ASPECT, L(10) - M), w = h / PHOTO_ASPECT;
    const els = [{ k: 'p', x: X(1), y: M, w, h, stand: !ph, role: 'photo' }];
    els.push(...infoStack([{ s: c.details, wt: 500, role: 'details' }, { s: c.date, role: 'date' }, { s: c.caption, role: 'caption' }], 10, 12, M).els);
    const top = M + h + GAP * 1.5;
    const size = sizeFor(lines, SPAN(1, 12), L(16) - top);
    els.push(disp(lines.join('\n'), { size, x: X(1), top }));
    return { els, did: 'Like a museum plate: the image in nine columns, the smaller text in a column beside it, the title underneath.' };
  });

  defNew('panel', 'Panel', ({ c, ph, lines }) => {
    const els = [cover(ph)];
    const px = XR(8) + M, py = L(9);
    els.push({ k: 'r', x: 0, y: py, w: px, h: H - py, color: 'field', role: 'panel', ok: true, bleed: true });
    const f = infoRowAt(c, [['details', 1, 4], ['date', 5, 8]], L(16));
    els.push(...f.els);
    const top = py + M;
    const size = sizeFor(lines, SPAN(1, 8), f.top - GAP * 1.5 - top);
    els.push(disp(lines.join('\n'), { size, x: X(1), top }));
    els.push(info(c.caption, { x: X(1), w: SPAN(1, 6), top: M, color: 'field', role: 'caption' }));
    return { els, did: 'The photo covers the page; a solid panel in the field colour holds the type in the lower left.' };
  });

  defNew('sideSplit', 'Side split', ({ c, ph, words, lines, kind }) => {
    const els = [cover(ph)];
    const px = XR(5) + G / 2;
    els.push({ k: 'r', x: px, y: 0, w: W - px, h: H, color: 'field', role: 'panel', ok: true, bleed: true });
    const st = stackBottom([{ s: c.details, wt: 500, role: 'details' }, { s: c.date, role: 'date' }, { s: c.caption, role: 'caption' }], 7, 12, L(16));

    els.push(disp(ls.join('\n'), { size, x: X(7), top: M }));

  });

  defNew('cross', 'Cross', ({ c, ph, kind, lines }) => {
    const top = L(3), h = Math.min(SPAN(4, 9) * PHOTO_ASPECT, L(14) - top), w = h / PHOTO_ASPECT;
    const els = [{ k: 'p', x: (X(4) + XR(9) - w) / 2, y: top, w, h, stand: !ph, role: 'photo', ok: true }];

    const size = Math.min(fitSize(ls, W * 1.1 - M), RH * 4.5 / hh, (top + h * 0.62 - L(1.5)) / hh);
    const base = top + h * 0.62 + (ls.length - 1) * DISPLAY.lh * size * 0.5;
    els.push(disp(ls.join('\n'), { size, x: M - 0.04 * size, base, bleed: true, ok: true }));
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 8), top: M }));
    els.push(info(c.date, { x: X(9), w: SPAN(9, 12), top: M, role: 'date' }));
    els.push(info(c.caption, { x: X(1), w: SPAN(1, 6), base: L(16), role: 'caption' }));
    return { els, did: 'A small centred photo; the title runs across it and off the right edge.' };
  });

  defNew('overlap', 'Overlap', ({ c, ph, lines }) => {
    const top = L(2), h = Math.min((W - X(5)) * PHOTO_ASPECT, L(14) - top), w = h / PHOTO_ASPECT, x = W - w;
    const els = [{ k: 'p', x, y: top, w, h, stand: !ph, role: 'photo', ok: true, bleed: true }];
    const size = sizeFor(lines, SPAN(1, 8), RH * 6);

    els.push(disp(lines.join('\n'), { size, x: X(1), base, ok: true }));
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 4), top: M }));
    els.push(info(c.date, { x: X(9), w: SPAN(9, 12), top: M, role: 'date' }));
    els.push(info(c.caption, { x: X(1), w: SPAN(1, 6), base: L(16), role: 'caption' }));
    return { els, did: 'The photo bleeds off the right edge; the title steps onto its left side.' };
  });

  defNew('stamp', 'Stamp', ({ c, ph, lines }) => {
    const h = Math.min(SPAN(10, 12) * PHOTO_ASPECT, L(5) - M), w = h / PHOTO_ASPECT;
    const els = [{ k: 'p', x: XR(12) - w, y: M, w, h, stand: !ph, role: 'photo' }];
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 8), top: M }));

  defNew('column', 'Column', ({ c, ph, kind, words, lines }) => {
    const st0 = infoStack([{ s: c.details, wt: 500, role: 'details' }, { s: c.date, role: 'date' }, { s: c.caption, role: 'caption' }], 1, 4, 0);
    const h = Math.min(SPAN(1, 4) * PHOTO_ASPECT, L(16) - M - st0.bottom - GAP), w = h / PHOTO_ASPECT;
    const els = [{ k: 'p', x: X(1), y: M, w, h, stand: !ph, role: 'photo' }];
    els.push(...infoStack([{ s: c.details, wt: 500, role: 'details' }, { s: c.date, role: 'date' }, { s: c.caption, role: 'caption' }], 1, 4, M + h + GAP).els);
    const ls = kind === 'word' ? lines : words;
    const size = sizeFor(ls, SPAN(6, 12), L(16) - M);
    els.push(disp(ls.join('\n'), { size, x: X(6), top: M }));
    return { els, did: 'Photo in the first four columns; the title hangs from the same top line beside it.' };
  });

  defNew('rising', 'Rising', ({ c, ph, lines }) => {
    const top = L(9), w = W, h = W * PHOTO_ASPECT;
    const els = [{ k: 'p', x: 0, y: top, w, h, stand: !ph, role: 'photo', bleed: true }];
    const row = infoRowAt(c, FOOT3, top - GAP);
    els.push(...row.els);
    const size = sizeFor(lines, SPAN(1, 12), row.top - GAP * 1.5 - M);
    els.push(disp(lines.join('\n'), { size, x: X(1), top: M }));
    return { els, did: 'Type from the top margin; the photo rises from the bottom edge.' };
  });

  // ─────────── overlap family: the main elements cross on purpose ───────────
  const defOver = (id, name, fits, needs, fn) => { def(id, name, fits, needs, fn); Object.assign(P[P.length - 1], { isNew: true, fam: 'overlap' }) };

  defOver('overprint', 'Overprint', ALL, null, ({ c, ph, lines }) => {
    const els = [];
    const tTop = ph ? L(6) : L(2);
    const size = sizeFor(lines, SPAN(1, 12), (ph ? L(10) : L(9)) - tTop);
    const tH = blockH(lines.length, size, DISPLAY.lh);
    const dLines = c.details.split(' ');
    const dTop = tTop + tH * 0.55;
    const dSize = Math.min(size, sizeFor(dLines, SPAN(1, 12), L(15) - GAP - dTop));
    els.push(disp(lines.join('\n'), { size, x: X(1), top: tTop, over: ['details'] }));
    els.push(disp(dLines.join('\n'), { size: dSize, x: X(1), top: dTop, color: 'accent', blend: true, role: 'details', over: ['title'] }));
    if (ph) {
      els.push(info(c.date, { x: X(1), w: SPAN(1, 6), top: M, role: 'date' }));
      els.push(photoIn({ c1: 7, c2: 12, top: M, bottom: tTop - GAP }));
      els.push(info(c.caption, { x: X(1), w: SPAN(1, 6), base: L(16), role: 'caption' }));
    } else els.push(...infoRow(c, FOOT2, 'foot').els);
    return { els, did: `${q(c.details)}, set as large as the title, overprints its lower half in accent.` };
  });

  defOver('dateBehind', 'Date behind', ALL, null, ({ c, ph, lines }) => {
    // short lines set bigger: "19.09.–15.11.2026" → 19.09. / –15.11. / 2026
    let dl = c.date.replace('–', '\n–').split('\n');
    const yr = dl[dl.length - 1].match(/^(.*\.)(\d{4})$/);
    if (yr && !/\d{4}/.test(dl[0])) dl = [...dl.slice(0, -1), yr[1], yr[2]];
    const f = infoRow(c, [['details', 1, 4], ['caption', 5, 12]], 'foot');
    const dSize = sizeFor(dl, SPAN(1, 12), (ph ? L(7) : f.top - GAP) - M);
    const els = [disp(dl.join('\n'), { size: dSize, x: X(1), top: M, color: 'accent', role: 'date', over: ['title'] })];
    const dH = blockH(dl.length, dSize, DISPLAY.lh);
    const size = sizeFor(lines, SPAN(1, 12), Math.min(RH * 6, dH * 0.8));
    const tH = blockH(lines.length, size, DISPLAY.lh);
    const base = M + dH / 2 + tH / 2;                    // the title sits on the middle of the date block
    els.push(disp(lines.join('\n'), { size, x: X(1), base, blend: true, over: ['date'] }));
    els.push(...f.els);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: Math.max(base, M + dH) + GAP, bottom: f.top - GAP }, { ay: 'bottom' }));
    return { els, did: `${q(c.date)}, huge in accent, sits behind the title.` };
  });

  defOver('tightStack', 'Tight stack', ['phrase', 'sentence'], null, ({ c, ph, lines }) => {
    const lh = 0.64;
    const f = infoRow(c, FOOT3, 'foot');
    const base = ph ? L(8) : f.top - GAP * 1.5;
    const size = Math.min(fitSize(lines, SPAN(1, 12)), (base - M) / ((lines.length - 1) * lh + CAP));
    const els = [disp(lines.join('\n'), { size, x: X(1), base, lh })];
    els.push(...f.els);
    if (ph) els.push(photoIn({ c1: 1, c2: 12, top: base + GAP, bottom: f.top - GAP }, { ay: 'bottom' }));
    return { els, did: 'Lines pulled so close that the letters cut into each other.' };
  });

  defOver('behindPhoto', 'Behind the photo', ALL, { image: true }, ({ c, ph, kind, lines }) => {
    const top = L(2.5), h = Math.min(SPAN(4, 9) * PHOTO_ASPECT, L(14) - top), w = h / PHOTO_ASPECT;
    const photo = { k: 'p', x: (X(4) + XR(9) - w) / 2, y: top, w, h, stand: !ph, role: 'photo', over: ['title'] };
    const ls = kind === 'sentence' ? lines : [c.title];
    const hh = (ls.length - 1) * DISPLAY.lh + CAP;
    const size = Math.min(fitSize(ls, SPAN(1, 12)), RH * 4.5 / hh, h * 0.8 / hh);
    const base = top + h / 2 + hh * size / 2;
    const els = [disp(ls.join('\n'), { size, x: X(1), w: SPAN(1, 12), base, over: ['photo'], just: ls.length === 1 && ls[0].includes(' ') }), photo];
    els.push(sec(c.details, { x: X(1), w: SPAN(1, 8), top: M }));
    els.push(info(c.date, { x: X(9), w: SPAN(9, 12), top: M, role: 'date' }));
    els.push(info(c.caption, { x: X(1), w: SPAN(1, 6), base: L(16), role: 'caption' }));
    return { els, did: 'The title passes behind the photo and shows on either side of it.' };
  });

  defOver('collage', 'Collage', ALL, { image: true, shape: true }, ({ c, ph, lines }) => {
    const top = L(1), h = Math.min(SPAN(1, 8) * PHOTO_ASPECT, L(10) - top), w = h / PHOTO_ASPECT;

    const size = sizeFor(lines, SPAN(1, 12), RH * 5);
    const base = top + h + CAP * size * 0.45 + (lines.length - 1) * DISPLAY.lh * size;
    const els = [photo, circle, disp(lines.join('\n'), { size, x: X(1), base, over: ['photo'] })];

    els.push(...infoRow(c, FOOT2, 'foot').els);

  });

  defOver('label', 'Label', ALL, { image: true, shape: true }, ({ c, ph, lines }) => {
    const h = Math.min(SPAN(1, 12) * PHOTO_ASPECT, L(10) - M), w = h / PHOTO_ASPECT;

    const size = sizeFor(lines, SPAN(1, 12), L(16) - top);

  });

  defOver('ghost', 'Ghost', ALL, null, ({ c, ph, lines }) => {

    const base = L(12);

    const gBase = base + CAP * gSize * 0.5;               // the ghost crosses the title's lower half
    const els = [disp(c.details, { size: gSize, x: M - 0.04 * gSize, base: gBase, bleed: true, opacity: 0.16, role: 'details', over: ['title', 'photo'] })];
    els.push(disp(lines.join('\n'), { size, x: X(1), base, over: ['details'] }));

  });

  // ═══════════════════════ content, colours, photo ═══════════════════════
  const VENUE = 'Kunstraum Lenz\nLenzgasse 14, 4056 Basel';
  const CONTENT = {
    word:     { title: 'Echoes', details: 'Yu Oda', date: '26.02.–10.05.2027', caption: VENUE },
    phrase:   { title: 'Weather Report', details: 'Ines Vollmer', date: '19.09.–15.11.2026', caption: VENUE },
    sentence: { title: 'Everything slow is still moving', details: 'Aurelio Bassanelli', date: '27.11.2026–14.02.2027', caption: VENUE },
  };
  const PALETTES = [
    { name: 'Pink, black, cobalt', field: '#ff6eb4', ink: '#121212', accent: '#2233e6' },
    { name: 'Stone, black, vermilion', field: '#dcd9d1', ink: '#1a1a1a', accent: '#e8391a' },
    { name: 'Cobalt, paper, pink', field: '#2233e6', ink: '#f3f1ea', accent: '#ff6eb4' },
    { name: 'Ivory, black, bronze', field: '#f0ebe1', ink: '#191613', accent: '#8a6440' },
    { name: 'Black, paper, red', field: '#121212', ink: '#f3f1ec', accent: '#ff3b1f' },
  ];

  function makePhoto() {

    if (withKeep && keep) {
      poster.insertAdjacentHTML('beforeend', `<div class="keepzone" style="top:0;height:${keep.top * 100}%">Covered by the app</div><div class="keepzone" style="bottom:0;height:${keep.bottom * 100}%">Covered by the app</div>` +
        (keep.side ? `<div class="keepzone" style="top:0;bottom:0;right:auto;width:${keep.side * 100}%"></div><div class="keepzone" style="top:0;bottom:0;left:auto;width:${keep.side * 100}%"></div>` : ''));
    }
    return poster;
  }

  // the shared checker, plus: no text in areas the platform covers
  function pageCheck(poster, els) {
    const issues = check(poster, els);
    if (STYLE.check) issues.push(...STYLE.check({ els }));
    poster.querySelectorAll('.sheet-inner > [data-inside]').forEach(el => {     // text meant to sit inside a shape must fit inside it
      const sh = poster.querySelector(`.sheet-inner > [data-role="${el.dataset.inside}"]`); if (!sh) return;
      const a = sh.getBoundingClientRect(), rg = document.createRange(); rg.selectNodeContents(el);
      const t = rg.getBoundingClientRect(), eb = el.getBoundingClientRect();
      const box = { l: t.left, r: t.right, t: eb.top, b: eb.bottom };
      const round = sh.style.borderRadius === '50%';
      const cx = (a.left + a.right) / 2, cy = (a.top + a.bottom) / 2, rad = a.width / 2;
      const inside = round
        ? [[box.l, box.t], [box.r, box.t], [box.l, box.b], [box.r, box.b]].every(([x, y]) => Math.hypot(x - cx, y - cy) <= rad * 0.97)
        : box.l >= a.left && box.r <= a.right && box.t >= a.top && box.b <= a.bottom;
      if (!inside) issues.push(`${el.dataset.role} does not fit inside its ${el.dataset.inside}`);
    });
    {                                            // padding inside panels and cards
      const pr = poster.getBoundingClientRect(), u = 100 / pr.width, minPad = M * 0.9;
      const boxes = [...poster.querySelectorAll('.sheet-inner > [data-role="panel"], .sheet-inner > [data-role="card"]')].map(el => {
        const b = el.getBoundingClientRect();
        return { x0: Math.max(0, (b.left - pr.left) * u), y0: Math.max(0, (b.top - pr.top) * u), x1: Math.min(W, (b.right - pr.left) * u), y1: Math.min(H, (b.bottom - pr.top) * u) };
      });
      if (boxes.length) poster.querySelectorAll('.sheet-inner > .t, .sheet-inner > .tx').forEach(el => {
        if (el.style.transform) return;
        const b = el.getBoundingClientRect(), x0 = (b.left - pr.left) * u, y0 = (b.top - pr.top) * u, x1 = (b.right - pr.left) * u, y1 = (b.bottom - pr.top) * u;
        const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        for (const bx of boxes) if (cx > bx.x0 && cx < bx.x1 && cy > bx.y0 && cy < bx.y1 && Math.min(x0 - bx.x0, bx.x1 - x1, y0 - bx.y0, bx.y1 - y1) < minPad - 0.2) { issues.push('too close to the edge of its panel'); break }
      });
    }
    const lg = poster.querySelector('.sheet-inner > [data-role="logo"]');
    if (lg) {                                   // space kept clear around the logo
      const b = lg.getBoundingClientRect(), pad = b.height * 0.35;
      poster.querySelectorAll('.sheet-inner > [data-role]').forEach(el => {
        if (el === lg || el.dataset.ok === '1' || (el.dataset.over || '').includes('logo')) return;
        const r = el.getBoundingClientRect();
        if (Math.min(b.right + pad, r.right) - Math.max(b.left - pad, r.left) > 1 && Math.min(b.bottom + pad, r.bottom) - Math.max(b.top - pad, r.top) > 1) issues.push('too close to the logo');
      });
    }
    const keep = SHAPES[state.format].keep;
    if (keep) {
      const pr = poster.getBoundingClientRect(), u = 100 / pr.width;
      poster.querySelectorAll('.sheet-inner > .t, .sheet-inner > svg').forEach(el => {
        const b = el.getBoundingClientRect(), y0 = (b.top - pr.top) * u, y1 = (b.bottom - pr.top) * u;
        const x0 = (b.left - pr.left) * u, x1 = (b.right - pr.left) * u, sd = (keep.side || 0) * W;
        if (y0 < H * keep.top - 0.3 || y1 > H * (1 - keep.bottom) + 0.3 || x0 < sd - 0.3 || x1 > W - sd + 0.3) issues.push('text under the app’s interface');
      });
    }
    return issues;
  }

  const DEF = { lines: 0, arr: 0, scale: 'full', accent: 'none', photo: 'right', cta: 'drawn' };
  function candidatesFor(p, idx) {
    const lineOpts = lineOptions(state.kind, cur(), p);
    const probe = $('probe');
    const defSig = sig(runCandidate(p, idx, DEF, lineOpts));
    const arrVaries = [1, 2].some(a => sig(runCandidate(p, idx, { ...DEF, arr: a }, lineOpts)) !== defSig);
    const photoMatters = state.ph && sig(runCandidate(p, idx, { ...DEF, photo: 'left' }, lineOpts)) !== defSig;
    const vals = {
      lines: lineOpts.map(o => o.v), arr: arrVaries ? [0, 1, 2] : [0], scale: p.keepScale ? ['full'] : ['full', 'quiet'],
      accent: accentValues(), photo: photoMatters ? ['right', 'left'] : ['right'],
      cta: SHAPES[state.format].nativeCTA && cur().action && p.style ? ['drawn', 'native'] : ['drawn'],
    };
    let combos = [{}];
    for (const k of Object.keys(vals)) combos = combos.flatMap(cmb => vals[k].map(v => ({ ...cmb, [k]: v })));
    const seen = new Set(), list = [], pal = PALETTES[state.pal];
    for (const axes of combos) {
      const out = runCandidate(p, idx, axes, lineOpts);
      const s = sig(out); if (seen.has(s)) continue; seen.add(s);
      probe.replaceChildren(makePoster(out, pal));
      if (pageCheck(probe.firstChild, out.els).length) continue;
      const texts = out.els.filter(e => e.k === 't');
      const maxSize = Math.max(...texts.map(e => e.size || 0));
      const edges = new Set(texts.filter(e => !e.rot && (e.align || 'left') === 'left').map(e => Math.round(e.x))).size;
      const isDef = Object.keys(DEF).every(k => axes[k] === DEF[k]);
      const styleScore = STYLE.rank ? STYLE.rank(out, probe.firstChild) : 0;
      list.push({ axes, out, score: styleScore + Math.log(maxSize / INFO.size) - 0.12 * edges + (isDef ? 1 : 0) + (axes.accent === 'none' ? 0.15 : 0) - (axes.scale === 'quiet' ? 0.35 : 0) });
    }
    probe.replaceChildren();
    const WT = { lines: 3, arr: 3, photo: 2, scale: 1.5, accent: 1, cta: 1.5 };
    const dist = (a, b) => Object.keys(WT).reduce((d, k) => d + (a.axes[k] !== b.axes[k] ? WT[k] : 0), 0);
    list.sort((a, b) => b.score - a.score);
    const ordered = list.length ? [list.shift()] : [];
    while (list.length) {
      let bi = 0, bv = -Infinity;
      list.forEach((c, i) => { const v = Math.min(...ordered.slice(-3).map(o => dist(o, c))) + c.score * 0.8; if (v > bv) { bv = v; bi = i } });
      ordered.push(list.splice(bi, 1)[0]);
    }
    return { list: ordered, lineOpts };
  }

  const fits = p => (p.needsKind || []).every(k => cur()[k] != null) && (p.style || 'swiss') === state.style && (!p.wideOnly || H < 70) && p.fits.includes(state.kind) && (!p.needsNumber || isNumberish(cur().date))
    && !(SHAPES[state.format].carries < 3 && ['index', 'badge', 'dateBehind', 'label', 'sidebar', 'fourCorners'].includes(p.id));   // built around the smaller text

  // The library: which layouts work for this content in this format.
  let lib = { key: '', items: [], dropped: [] };
  function computeLib() {
    const key = [state.content, state.format, state.ph, state.pal, state.style, state.useFace].join('|');
    if (lib.key === key) return;
    const pal = PALETTES[state.pal], probe = $('probe');
    const items = [], dropped = [];
    P.forEach((p, i) => {
      if (!fits(p)) return;
      const out = runCandidate(p, i, DEF, lineOptions(state.kind, cur(), p));
      probe.replaceChildren(makePoster(out, pal));
      if (!pageCheck(probe.firstChild, out.els).length) { items.push({ p, i, out }); return }
      const { list } = candidatesFor(p, i);
      if (list.length) items.push({ p, i, out: list[0].out }); else dropped.push(p.name);
    });
    probe.replaceChildren();
    lib = { key, items, dropped };
  }

  let lineOptsCur = [];
  function selectLayout(id, keepAxes) {
    setShape(state.format);
    computeLib();
    if (!lib.items.some(it => it.p.id === id)) id = lib.items[0]?.p.id;
    if (!id) {                                  // nothing in this style fits this format: say so
      state.list = []; state.idx = 0;
      $('stage').querySelector('.poster')?.remove();
      $('lname').textContent = 'No layout fits';
      $('did').textContent = `None of the ${STYLES[state.style].label} layouts pass the checks for this content at this format. Try another style or format.`;
      $('count').textContent = ''; $('choices').replaceChildren(); $('strip').replaceChildren();
      ['prev', 'next', 'fwd'].forEach(k => $(k).disabled = true);
      renderLib(); return;
    }
    const idx = P.findIndex(p => p.id === id), p = P[idx];
    const prev = keepAxes && state.list[state.idx]?.axes;
    const { list, lineOpts } = candidatesFor(p, idx);
    state.layout = id; state.list = list; lineOptsCur = lineOpts; state.idx = 0;
    if (prev) { const j = list.findIndex(c => Object.keys(prev).every(k => c.axes[k] === prev[k])); if (j >= 0) state.idx = j }
    show(); renderLib();
  }

  function show() {
    const p = byId(state.layout), cand = state.list[state.idx], pal = PALETTES[state.pal], sh = SHAPES[state.format];
    const stage = $('stage');
    stage.querySelector('.poster')?.remove();
    stage.style.setProperty('--arinv', String(100 / H));
    if (cand) stage.prepend(makePoster(cand.out, pal, true));
    $('fmtnote').textContent = `${sh.label} · ${sh.px}` + (sh.view ? ` · seen about ${sh.view}px wide, so text is at least ${INFO.size.toFixed(1)}% of the width` : '') + (sh.keep ? ' · hatched areas are covered by the app' : '') + (sh.carries ? ` · carries only the ${sh.carries === 2 ? 'two' : 'three'} most important lines` : '');
    $('lname').textContent = p.name;
    $('did').textContent = cand ? cand.out.did : '';
    $('count').textContent = state.list.length ? `${state.idx + 1} of ${state.list.length}` : '';
    ['prev', 'next', 'fwd'].forEach(id => $(id).disabled = state.list.length < 2);

    const box = $('choices'); box.replaceChildren();
    for (const ax of AXES) {
      const order = ax.key === 'lines' ? lineOptsCur.map(o => o.v) : ax.key === 'accent' ? accentValues() : ax.values;
      const present = new Set(state.list.map(c => c.axes[ax.key]));
      const values = order.filter(v => present.has(v));
      if (values.length < 2) continue;
      const labels = values.map(v => ax.key === 'lines' ? lineOptsCur[v].label : ax.key === 'accent' ? accentLabel(v) : ax.labels[ax.values.indexOf(v)]);
      const row = document.createElement('div'); row.className = 'choice';
      row.innerHTML = `<span class="lab"></span><div class="pills" role="group"></div>`;
      row.querySelector('.lab').textContent = ax.label;
      row.querySelector('.pills').setAttribute('aria-label', ax.label);
      values.forEach((v, i) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'pill';
        b.textContent = labels[i]; b.title = labels[i];
        b.setAttribute('aria-pressed', String(cand && cand.axes[ax.key] === v));
        b.addEventListener('click', () => setAxis(ax.key, v));
        row.querySelector('.pills').appendChild(b);
      });
      box.appendChild(row);
    }

    const strip = $('strip'); strip.replaceChildren();
    const n = Math.min(8, state.list.length), startAt = state.idx < 8 ? 0 : state.idx - 7;
    strip.style.gridTemplateColumns = `repeat(${H < 40 ? 2 : 4}, 1fr)`;
    for (let k = startAt; k < startAt + n; k++) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'thumb';
      b.setAttribute('aria-label', `Variation ${k + 1}`);
      if (k === state.idx) b.setAttribute('aria-current', 'true');
      b.appendChild(makePoster(state.list[k].out, pal));
      b.addEventListener('click', () => { state.idx = k; show(); toast(`Variation ${k + 1} applied`) });
      strip.appendChild(b);
    }
  }

  function setAxis(key, v) {
    const now = state.list[state.idx].axes;
    let best = -1, bestScore = -1;
    state.list.forEach((c, i) => {
      if (c.axes[key] !== v) return;
      const same = Object.keys(now).filter(k => k !== key && c.axes[k] === now[k]).length;
      if (same > bestScore) { bestScore = same; best = i }
    });
    if (best >= 0) { state.idx = best; show(); toast('Applied') }
  }
  function vary(d) {
    if (state.list.length < 2) return;
    state.idx = (state.idx + d + state.list.length) % state.list.length;
    show(); toast(`Variation ${state.idx + 1} of ${state.list.length}`);
  }
  let tt; function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1100) }

  function renderLib() {
    const el = $('lib'); el.replaceChildren();
    const pal = PALETTES[state.pal];
    el.style.gridTemplateColumns = `repeat(${H < 40 ? 2 : 3}, 1fr)`;
    $('libcount').textContent = `${lib.items.length} fit`;
    for (const { p, out } of lib.items) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'tile';
      if (p.id === state.layout) b.setAttribute('aria-current', 'true');
      b.appendChild(makePoster(out, pal));
      const s = document.createElement('span'); s.textContent = p.name; b.appendChild(s);
      b.addEventListener('click', () => { selectLayout(p.id); toast(`${p.name} applied`) });
      el.appendChild(b);
    }
    if (lib.dropped.length) {
      const n = document.createElement('p'); n.className = 'none';
      n.textContent = `Not offered for this format: ${lib.dropped.join(', ')}. None of their variations pass the checks.`;
      el.appendChild(n);
    }
  }

  // try-it controls
  function seg(id, key, parse) {
    const root = $(id);
    root.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      root.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      state[key] = parse(b.dataset.v);
      if (key === 'content') applyContent();
      selectLayout(state.layout, true);
    });
  }
  seg('content', 'content', v => v); seg('photo', 'ph', v => v === '1');
  const fmt = $('format');
  for (const [k, s] of Object.entries(SHAPES)) { const o = document.createElement('option'); o.value = k; o.textContent = `${s.label} · ${s.px}`; fmt.appendChild(o) }
  fmt.addEventListener('change', () => { state.format = fmt.value; selectLayout(state.layout, true) });
  PALETTES.forEach((pp, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'sw';
    b.style.background = pp.field; b.setAttribute('aria-label', pp.name); b.setAttribute('aria-pressed', String(i === 0));
    b.innerHTML = `<i style="background:${pp.ink}"></i>`;
    b.addEventListener('click', () => { $('pal').querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', String(x === b))); state.pal = i; selectLayout(state.layout, true) });
    $('pal').appendChild(b);
  });
  $('next').addEventListener('click', () => vary(1));
  $('fwd').addEventListener('click', () => vary(1));
  $('prev').addEventListener('click', () => vary(-1));
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('select')) return;
    if (e.key === 'v' || e.key === 'V') { e.preventDefault(); vary(1) }
    else if (e.key === 'ArrowRight') { e.preventDefault(); vary(1) }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); vary(-1) }
  });
  window.__pane = { state, select: selectLayout, lib: () => lib, count: () => state.list.length };

  function renderFaceNote() {
    const f = STYLES[state.style].face, el = $('facenote');
    el.hidden = !f; if (!f) return;
    el.replaceChildren();
    const t = document.createElement('span');
    t.textContent = state.useFace ? `Title set in ${f.family}.` : `This style suggests ${f.family}, ${f.note}.`;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pill';
    b.textContent = state.useFace ? 'Use my font' : 'Use it';
    b.addEventListener('click', () => { state.useFace = !state.useFace; setStyle(state.style, state.useFace); renderFaceNote(); selectLayout(state.layout, true); toast(state.useFace ? `${f.family} applied` : 'Your font is back') });
    el.append(t, b);
  }
  $('style').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $('style').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    state.style = b.dataset.v; state.useFace = false; setStyle(state.style, false); renderFaceNote();
    selectLayout(state.layout, true); toast(`${STYLES[state.style].label} style`);
  });
  window.__pane.setStyle = k => { $('style').querySelector(`[data-v="${k}"]`).click() };
  window.__pane.force = id => { setShape(state.format); const i = P.findIndex(p => p.id === id), p = P[i]; const o = runCandidate(p, i, DEF, lineOptions(state.kind, cur(), p)); const st = $('stage'); st.querySelector('.poster')?.remove(); st.prepend(makePoster(o, PALETTES[state.pal], true));
    const poster = st.querySelector('.poster'), pr = poster.getBoundingClientRect(), u = 100 / pr.width;
    return [...poster.querySelectorAll('.sheet-inner > [data-role]')].map(el => { const b = el.getBoundingClientRect(); return `${el.dataset.role}: y ${((b.top - pr.top) * u).toFixed(1)}–${((b.bottom - pr.top) * u).toFixed(1)} x ${((b.left - pr.left) * u).toFixed(1)}–${((b.right - pr.left) * u).toFixed(1)} fs ${el.style.fontSize}` }) };
  window.__pane.w100 = t => w100(t, DISPLAY);
  window.__pane.checkStage = () => [...new Set(pageCheck($('stage').querySelector('.poster'), state.list[state.idx].out.els))];
  window.__pane.diag = () => { setShape(state.format); const out = {}; P.forEach((p, i) => { if (!fits(p)) return; const o = runCandidate(p, i, DEF, lineOptions(state.kind, cur(), p)); const pr = $('probe'); pr.replaceChildren(makePoster(o, PALETTES[state.pal])); out[p.name] = [...new Set(pageCheck(pr.firstChild, o.els))].join('; ') || 'ok' }); $('probe').replaceChildren(); return out };
  setStyle(state.style, false); renderFaceNote();
  applyContent();
  const faceLoads = ['400 100px "Instrument Serif"', '400 100px Anton', '700 100px Geist', '600 100px Caveat'].map(f => document.fonts ? document.fonts.load(f).catch(() => {}) : null);
  const whenSized = fn => {
    if ($('stage').getBoundingClientRect().width > 0) return fn();
    const ro = new ResizeObserver(() => { if ($('stage').getBoundingClientRect().width > 0) { ro.disconnect(); fn() } });
    ro.observe($('stage'));
  };
  Promise.all([...faceLoads, document.fonts ? document.fonts.ready : null]).then(() => whenSized(() => { cache.clear(); lib.key = ''; selectLayout(state.layout) }));
})();
</script>
